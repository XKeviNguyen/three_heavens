production:
  reconcile_stale_ai_work:
    class: StaleAiWorkReconciliationJob
    queue: operations
    schedule: every 15 minutes
  reconcile_authorized_pipelines:
    class: PipelineReconciliationJob
    queue: operations
    args: [100]
    schedule: every 10 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_abandoned_source_imports:
    class: SourceImportCleanupJob
    queue: operations
    schedule: every hour at minute 27
  cleanup_abandoned_workspace_submissions:
    class: TranslationWorkspaceSubmissionCleanupJob
    queue: operations
    schedule: every hour at minute 37
  cleanup_expired_workspace_drafts:
    class: TranslationWorkspaceDraftCleanupJob
    queue: operations
    schedule: every hour at minute 47
  cleanup_unattached_active_storage_blobs:
    class: ActiveStorageCleanupJob
    queue: operations
    schedule: every day at 2:47am
