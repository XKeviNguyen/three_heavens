ja:
  managed_key:
    title: AIキー
    description: "アプリのOpenRouterキーは、アプリのAI利用権限を使うアカウントのAI処理の料金を支払います。ここに保存したキーはサーバーのOPENROUTER_API_KEYの代わりに使われ、削除するとサーバーのキーに戻ります。"
    current_heading: 使用中のキー
    source:
