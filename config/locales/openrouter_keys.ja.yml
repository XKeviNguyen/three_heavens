      missing: "ここにキーが保存されておらず、サーバーにもOPENROUTER_API_KEYがないため、アプリのAI利用は実行できません。"
      unreadable: "保存済みのキーを復号できない（サーバーの秘密鍵が変更された）ため、サーバーのOPENROUTER_API_KEY（%{hint}）を使っています。キーを保存し直してください。"
      no_hint: "なし"
    save_heading: キーを保存
    replace_heading: キーを置き換える
    key_label: OpenRouter APIキー
