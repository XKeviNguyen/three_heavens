vi:
  product_tour:
    ui:
      help: Trợ giúp
      full_tour: Tham quan toàn bộ sản phẩm
      page_tour: Tham quan trang này
      next: Tiếp
      back: Quay lại
      skip: Bỏ qua hướng dẫn
      finish: Hoàn tất
      close: Đóng hướng dẫn
      step_counter: "%{current}/%{total}"
      start_translation: Bắt đầu bản dịch mới
      refreshing: "Trang này tự làm mới khi công việc AI đang chạy. Bạn có thể xem hướng dẫn sau khi công việc hoàn tất."
      invite:
        title: Lần đầu dùng Three Heavens?
        body: Xem hướng dẫn bảy bước về cách dịch, nhận xét và thư viện kiến thức của bạn phối hợp với nhau. Hướng dẫn không thay đổi gì, và bạn có thể xem lại bất cứ lúc nào từ Trợ giúp.
        start: Xem hướng dẫn
        later: Để sau
    global:
      welcome:
        title: Chào mừng đến với Three Heavens
        body: Không gian dịch thuật có AI hỗ trợ. Nhiều mô hình cùng dịch, các mô hình khác nhận xét và chấm điểm kết quả một cách độc lập, còn bạn đưa ra quyết định biên tập cuối cùng, dựa trên thuật ngữ và ví dụ do bạn lưu giữ.
      workspace:
        title: Không gian làm việc của bạn
        body: Bắt đầu công việc mới từ Bản dịch mới. Dự án gom tài liệu và các lượt dịch của từng cặp ngôn ngữ lại một chỗ, còn Lịch sử liệt kê mọi lượt dịch, mới nhất trước, để bạn mở lại bất kỳ lượt nào.
      knowledge:
        title: Kiến thức dịch thuật
        body: Bảng thuật ngữ chứa các thuật ngữ ưu tiên, Bản dịch tham khảo chứa các bản dịch bạn đã duyệt, và Phương pháp chứa các hướng dẫn dùng lại được. Hãy chọn chúng khi bắt đầu dịch để giữ cách dùng từ và văn phong nhất quán.
      workflows:
        title: Cấu hình quy trình
        body: Lưu lại mô hình nào dịch, nhận xét, chấm điểm và đề xuất cải thiện. Chọn một cấu hình đã lưu ở chế độ Tự động, quy trình sẽ chạy dịch, nhận xét ẩn danh và chấm điểm giúp bạn, rồi dừng để bạn biên tập.
      ai_access:
        title: Truy cập AI và ai trả tiền
        body: Trong Cài đặt AI, bạn chọn ai trả tiền cho công việc AI mới. Khóa OpenRouter của riêng bạn tính vào tài khoản OpenRouter của bạn. AI do nền tảng quản lý do nền tảng trả tiền và cần quản trị viên phê duyệt. Bạn có thể hoàn tất hướng dẫn này mà không cần thêm khóa.
      start:
        title: Bắt đầu một bản dịch
        body: Chọn ngôn ngữ nguồn và đích, dán văn bản hoặc tải lên tệp TXT, Markdown, DOCX hoặc PDF, thêm hướng dẫn tùy chọn, rồi chọn mô hình hoặc cấu hình quy trình. Không có gì được gửi tới AI cho đến khi chính bạn bắt đầu.
      quality:
        title: Từ bản dịch ứng viên đến bản dịch cuối
        body: Bản dịch của mỗi mô hình trở thành một ứng viên. Các mô hình nhận xét đánh giá ứng viên mà không biết mô hình nào đã viết, các mô hình chấm điểm xếp hạng chúng, và bản thắng được mở trong trình biên tập, nơi bạn chỉnh sửa, so sánh các phiên bản, hoàn tất và tải về TXT hoặc DOCX.
    pages:
      new_translation:
        intro:
          title: Bản dịch mới
          body: Trang này gom mọi thứ một lượt dịch cần. Không có gì bắt đầu và không có khoản phí nào phát sinh cho đến khi bạn chọn bắt đầu.
        languages:
          title: Dự án và ngôn ngữ
          body: Chọn một dự án có sẵn, hoặc đặt tên cho dự án mới cùng ngôn ngữ nguồn và đích. Mỗi dự án chỉ có một cặp ngôn ngữ.
        source:
          title: Tài liệu nguồn
          body: Dán văn bản, hoặc chuyển sang Tải lên để chọn tệp TXT, Markdown, DOCX hoặc PDF. Bạn có thể xem và sửa văn bản đã trích xuất trước khi bắt đầu.
        knowledge:
          title: Hướng dẫn tùy chọn
          body: Chọn một bảng thuật ngữ để dùng các thuật ngữ ưu tiên. Tùy chọn nâng cao cho phép thêm bản dịch tham khảo, một phương pháp, và chọn hướng dẫn nào được ưu tiên.
        workflow:
          title: Quy trình AI
          body: Ở chế độ Thủ công, bạn chọn các mô hình dịch. Ở chế độ Tự động, một cấu hình quy trình đã lưu sẽ chạy cả nhận xét và chấm điểm. Dù chọn cách nào, bạn vẫn là người duyệt bản dịch cuối.
        launch:
          title: Kiểm tra và bắt đầu
          body: Xem ai trả tiền cho lượt dịch này và nó sẽ làm gì, rồi bắt đầu. Nút bắt đầu là điều khiển duy nhất ở đây gửi công việc tới AI.
      source_import:
        intro:
          title: Tải lên tệp nguồn
          body: Tải lên một tài liệu để chuyển thành văn bản nguồn có thể xem lại. Tải lên và xem trước không bao giờ gửi gì tới AI.
        file:
          title: Chọn hoặc thả tệp
          body: Hỗ trợ tệp TXT, Markdown, DOCX và PDF, trong giới hạn dung lượng hiển thị. Văn bản đã trích xuất sẽ được hiển thị để bạn kiểm tra trước khi dịch.
      projects:
        intro:
          title: Dự án
          body: Một dự án gom các tài liệu của một cặp ngôn ngữ và mọi lượt dịch được tạo từ chúng.
        list:
          title: Dự án của bạn
          body: Mở một dự án để xem các tài liệu và tiến độ của từng lượt dịch.
        start:
          title: Thêm công việc vào dự án này
          body: Dán văn bản nguồn mới hoặc tải lên một tệp; ngôn ngữ của dự án được điền sẵn cho bạn.
        documents:
          title: Tài liệu
          body: Mỗi tài liệu liệt kê các lượt dịch của nó, mới nhất trước. Bản gốc đã tải lên có thể tải xuống lại.
        next_action:
          title: Tiếp tục từ chỗ bạn đã dừng
          body: Liên kết được làm nổi bật luôn dẫn tới bước hữu ích tiếp theo của lượt dịch đó, chẳng hạn nhận xét ẩn danh, chấm điểm hoặc trình biên tập.
      history:
        intro:
          title: Lịch sử dịch
          body: Mọi lượt dịch bạn đã thực hiện, mới nhất trước, kèm trạng thái, mô hình và chi phí AI đã biết.
        list:
          title: Tìm một lượt dịch
          body: Mỗi mục hiển thị dự án, ngôn ngữ và hướng dẫn mà lượt dịch đã dùng.
        reopen:
          title: Mở lại hoặc lặp lại
          body: Tiếp tục bước kế tiếp, mở bất kỳ giai đoạn nào, hoặc lặp lại cấu hình của một lượt dịch thành bản dịch mới.
      terminology:
        intro:
          title: Bảng thuật ngữ
          body: Một bảng thuật ngữ liệt kê các thuật ngữ ưu tiên cho một cặp ngôn ngữ, để mọi bản dịch dùng cùng một cách diễn đạt.
        create:
          title: Tạo bảng thuật ngữ
          body: Bắt đầu một bảng thuật ngữ mới cho một cặp ngôn ngữ.
        list:
          title: Bảng thuật ngữ của bạn
          body: Có thể chọn các bảng thuật ngữ đang hoạt động khi bắt đầu dịch.
        entries:
          title: Thuật ngữ
          body: Thêm từng thuật ngữ nguồn cùng bản dịch ưu tiên. Khi lưu sẽ tạo một phiên bản mới.
        revisions:
          title: Phiên bản
          body: Mỗi thay đổi đã lưu là một phiên bản. Các lượt dịch giữ đúng phiên bản chúng đã dùng, kể cả sau khi bạn sửa bảng thuật ngữ.
        status:
          title: Sửa hoặc lưu trữ
          body: Tạo phiên bản mới, hoặc lưu trữ bảng thuật ngữ bạn không còn dùng cho công việc mới. Lưu trữ vẫn giữ lại lịch sử của nó.
      references:
        intro:
          title: Bản dịch tham khảo
          body: Một bản tham khảo ghép một đoạn nguồn với bản dịch bạn đã duyệt, để AI có thể theo cách dùng từ và văn phong đã định của bạn.
        create:
          title: Thêm bản tham khảo
          body: Tạo một bản tham khảo cho một cặp ngôn ngữ.
        list:
          title: Bản tham khảo của bạn
          body: Có thể chọn các bản tham khảo đang hoạt động trong tùy chọn nâng cao của bản dịch mới.
        source:
          title: Ví dụ nguồn
          body: Dán đoạn nguồn hoặc tải lên một tệp. Chỉ cung cấp văn bản dán hoặc tệp, không dùng cả hai.
        translation:
          title: Bản dịch đã duyệt
          body: Dán hoặc tải lên bản dịch bạn đã duyệt cho đoạn đó. Tệp được kiểm tra và trích xuất khi bạn lưu.
        revisions:
          title: Lịch sử phiên bản
          body: Mỗi lần lưu là một phiên bản. Các lượt dịch giữ đúng phiên bản chúng đã dùng.
      methodology:
        intro:
          title: Phương pháp
          body: Một phương pháp là hướng dẫn bằng văn bản, dùng lại được, về cách tạo bản dịch, chẳng hạn giọng văn, đối tượng đọc hoặc quy tắc định dạng.
        create:
          title: Tạo phương pháp
          body: Viết hướng dẫn một lần và dùng lại cho nhiều bản dịch.
        list:
          title: Phương pháp của bạn
          body: Có thể chọn các phương pháp đang hoạt động trong tùy chọn nâng cao của bản dịch mới.
        instructions:
          title: Hướng dẫn
          body: Mô tả bản dịch nên đọc như thế nào. Khi lưu sẽ tạo một phiên bản mới.
        revisions:
          title: Phiên bản
          body: Các lượt dịch giữ đúng phiên bản chúng đã dùng, nên kết quả trước đây vẫn giải thích được.
      workflows:
        intro:
          title: Cấu hình quy trình
          body: Một cấu hình quy trình lưu lại mô hình nào dịch, nhận xét, chấm điểm và đề xuất cải thiện, để dùng ở chế độ Tự động.
        create:
          title: Tạo cấu hình
          body: Bắt đầu một cấu hình mới, hoặc nhân bản một cấu hình có sẵn để điều chỉnh.
        list:
          title: Cấu hình của bạn
          body: Các cấu hình đang hoạt động xuất hiện ở chế độ Tự động trên trang Bản dịch mới.
        configure:
          title: Chọn mô hình
          body: Chọn mô hình cho từng vai trò. Các lượt chạy tự động dùng đúng những mô hình này và hiển thị công việc AI dự kiến trước khi bạn bắt đầu.
        completion:
          title: Khi nào dừng
          body: Dừng ở bản nháp thắng, hoặc thu thêm đề xuất của AI. Đề xuất không bao giờ thay đổi bản nháp của bạn trừ khi bạn áp dụng.
        pipeline:
          title: Tiến độ quy trình
          body: Một lượt chạy tự động đi qua dịch, nhận xét ẩn danh và chấm điểm, rồi dừng khi sẵn sàng để bạn biên tập.
      ai_settings:
        intro:
          title: Cài đặt AI
          body: Chọn ai trả tiền cho công việc AI mới. Không có gì trên trang này bắt đầu công việc AI.
        status:
          title: Trạng thái hiện tại
          body: Cho biết công việc AI mới có thể bắt đầu hay không và ai trả tiền.
        source:
          title: Nguồn thanh toán
          body: Khóa OpenRouter của riêng bạn tính vào tài khoản OpenRouter của bạn. AI do nền tảng quản lý do nền tảng trả tiền và cần quản trị viên phê duyệt.
        key:
          title: Khóa OpenRouter của bạn
          body: Khóa được lưu mã hóa và không bao giờ hiển thị lại; chỉ hiện vài ký tự cuối. Thay hoặc xóa khóa không bao giờ chuyển công việc của bạn sang khóa của nền tảng.
        billing:
          title: Cách tính phí
          body: Mỗi lượt chạy ghi lại ai trả tiền khi bắt đầu. Thay đổi cài đặt này chỉ ảnh hưởng đến công việc mới, và thử lại thủ công dùng bên trả tiền hiển thị bên cạnh.
      results:
        intro:
          title: Kết quả dịch
          body: Trang này theo dõi một lượt dịch từ các mô hình đến bước tiếp theo.
        progress:
          title: Lượt dịch đang ở đâu
          body: Dịch, nhận xét ẩn danh, chấm điểm và trình biên tập, với giai đoạn hiện tại được làm nổi bật.
        outputs:
          title: Bản dịch ứng viên
          body: Kết quả, trạng thái và chi phí đã biết của từng mô hình.
        retry:
          title: Khôi phục công việc thất bại
          body: Có thể thử lại thủ công các mô hình thất bại. Bảng này hiển thị ai sẽ trả tiền cho lần thử lại đó.
        next:
          title: Bước tiếp theo
          body: Khi có ít nhất hai ứng viên hoàn tất, hãy bắt đầu nhận xét ẩn danh, hoặc tiếp tục với phần nhận xét đã có.
      blind_review:
        intro:
          title: Nhận xét ẩn danh
          body: Các mô hình nhận xét đánh giá các ứng viên mà không biết mô hình nào đã viết.
        progress:
          title: Tiến độ quy trình
          body: Nhận xét ẩn danh là giai đoạn thứ hai, sau dịch.
        evaluations:
          title: Nhận xét
          body: Phản hồi có cấu trúc của từng mô hình nhận xét cho mỗi ứng viên, kèm cách diễn đạt đề xuất nếu có.
        retry:
          title: Khôi phục nhận xét thất bại
          body: Có thể thử lại thủ công các mô hình nhận xét thất bại. Bảng này hiển thị ai sẽ trả tiền cho lần thử lại đó.
        next:
          title: Tiếp tục sang chấm điểm
          body: Khi nhận xét hoàn tất, hãy chọn các mô hình chấm điểm để xếp hạng các ứng viên.
      judging:
        intro:
          title: Chấm điểm
          body: Các mô hình chấm điểm độc lập cho điểm và xếp hạng các ứng viên đã được nhận xét.
        progress:
          title: Tiến độ quy trình
          body: Chấm điểm là giai đoạn thứ ba; tiếp theo là trình biên tập.
        winner:
          title: Bản thắng
          body: Bản thắng chung cuộc và cách mở nó trong trình biên tập bản dịch cuối.
        runs:
          title: Kết quả chấm điểm
          body: Lựa chọn bản thắng, độ tin cậy, lý do, điểm mạnh và rủi ro của từng mô hình chấm điểm, để bạn thấy kết quả được đưa ra như thế nào.
        retry:
          title: Khôi phục chấm điểm thất bại
          body: Có thể thử lại thủ công các mô hình chấm điểm thất bại. Bảng này hiển thị ai sẽ trả tiền cho lần thử lại đó.
      final_editor:
        intro:
          title: Trình biên tập bản dịch cuối
          body: Bạn đưa ra các quyết định cuối cùng tại đây. Không có gì thay đổi bản nháp của bạn trừ khi chính bạn làm.
        guidance:
          title: Hướng dẫn đã dùng
          body: Bảng thuật ngữ, phương pháp và bản dịch tham khảo mà lượt dịch này đã dùng, để bạn đối chiếu khi biên tập.
        draft:
          title: Bản nháp của bạn
          body: Chỉnh sửa và lưu các phiên bản. Bạn có thể tải phiên bản hiện tại về dạng TXT hoặc DOCX bất cứ lúc nào.
        refine:
          title: Đề xuất của AI
          body: Nhờ các mô hình đề xuất cải thiện cho phiên bản hiện tại. Chỉ áp dụng một đề xuất nếu bạn muốn.
        revisions:
          title: Lịch sử phiên bản
          body: Mọi phiên bản đã lưu đều được giữ lại. Khôi phục một phiên bản cũ thành phiên bản nháp mới.
        finalize:
          title: Hoàn tất
          body: Hoàn tất phiên bản hiện tại khi đã sẵn sàng; bạn có thể mở lại sau nếu cần.
      benchmarks:
        intro:
          title: Thống kê mô hình
          body: Mỗi mô hình đã hoạt động ra sao trong các lượt dịch của riêng bạn. Mỗi giá trị trung bình cho biết nó dựa trên bao nhiêu kết quả.
        sort:
          title: Sắp xếp mô hình
          body: Sắp xếp mô hình theo thước đo bạn quan tâm.
        list:
          title: Kết quả của mô hình
