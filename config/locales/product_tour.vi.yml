vi:
  product_tour:
    ui:
      help: Hướng dẫn
      full_tour: Khám phá Three Heavens
      page_tour: Hướng dẫn trang này
      page_guides: Tự động hiện hướng dẫn cho từng trang
      page_guides_on: Bật
      page_guides_off: Tắt
      next: Tiếp theo
      back: Quay lại
      skip: Bỏ qua
      finish: Hoàn tất
      close: Đóng hướng dẫn
      step_counter: "%{current}/%{total}"
      start_translation: Bắt đầu bản dịch mới
      refreshing: Trang này tự cập nhật trong lúc AI xử lý. Bạn có thể mở hướng dẫn khi xử lý xong.
      auto_note: Hướng dẫn này chỉ tự hiện một lần. Bạn có thể xem lại hoặc tắt trong mục Hướng dẫn.
      invite:
        title: Lần đầu dùng Three Heavens?
        body: Xem nhanh cách các phần phối hợp với nhau. Việc này không thay đổi gì trong tài khoản của bạn.
        start: Xem hướng dẫn
        later: Để sau
    global:
      welcome:
        title: Chào mừng đến với Three Heavens
        points:
        - Các mô hình AI dịch văn bản của bạn.
        - Các mô hình khác nhận xét và xếp hạng từng bản dịch.
        - Bạn là người quyết định cuối cùng.
      workspace:
        title: Khu vực làm việc
        points:
        - Bắt đầu việc mới từ mục Bản dịch mới.
        - Mỗi dự án gom tài liệu của một cặp ngôn ngữ.
        - Lịch sử liệt kê mọi lượt dịch, mới nhất ở trên cùng.
      knowledge:
        title: Thư viện dịch thuật
        points:
        - Bảng thuật ngữ giúp bạn dùng từ nhất quán.
        - Bản dịch tham khảo là những bản dịch bạn đã duyệt.
        - Phương pháp cho AI biết bạn muốn văn phong thế nào.
      workflows:
        title: Cấu hình quy trình
        points:
        - Lưu sẵn các mô hình để dịch, nhận xét và chấm điểm.
        - Ở chế độ Tự động, cấu hình sẽ chạy từng bước giúp bạn.
        - Quy trình dừng trước bước biên tập cuối để bạn tự quyết định.
      ai_access:
        title: Dùng AI và thanh toán
        points:
        - Vào Cài đặt AI để chọn bên trả tiền cho các lượt chạy AI mới.
        - Nếu dùng khóa OpenRouter riêng, OpenRouter sẽ tính phí bạn.
        - Nếu dùng AI do nền tảng quản lý, Three Heavens trả tiền. Quản trị viên cần bật quyền này cho bạn.
      start:
        title: Bắt đầu một bản dịch
        points:
        - Chọn ngôn ngữ, rồi thêm văn bản hoặc tệp.
        - Chọn mô hình AI hoặc một cấu hình quy trình.
        - AI chỉ nhận dữ liệu khi bạn bấm bắt đầu.
      quality:
        title: Từ bản nháp đến bản dịch cuối
        points:
        - Bản dịch của mỗi mô hình là một bản ứng viên.
        - Các mô hình nhận xét và chấm điểm sẽ so sánh rồi chọn bản thắng.
        - Bản thắng được mở trong trình biên tập để bạn hoàn thiện và tải về.
    pages:
      new_translation:
        intro:
          title: Bản dịch mới
          points:
          - Trang này dùng để thiết lập một bản dịch.
          - Chưa có gì chạy hay bị tính phí cho đến khi bạn bấm bắt đầu.
        languages:
          title: Dự án và ngôn ngữ
          points:
          - Chọn một dự án có sẵn, hoặc đặt tên cho dự án mới.
          - Mỗi dự án dùng một cặp ngôn ngữ.
        source:
          title: Văn bản cần dịch
          points:
          - Dán văn bản, hoặc tải lên tệp TXT, Markdown, DOCX hay PDF.
          - Bạn có thể xem lại văn bản trước khi bắt đầu.
        terminology:
          title: Thuật ngữ
          points:
          - Dùng những từ bạn muốn AI dịch nhất quán.
          - Chọn bảng thuật ngữ đã lưu, hoặc thêm thuật ngữ tại đây.
        references:
          title: Bản dịch tham khảo
          points:
          - Chọn bản dịch mẫu mà bạn đã duyệt.
          - AI sẽ dựa vào đó để giữ cách diễn đạt phù hợp.
        methodology:
          title: Phương pháp
          points:
          - Chọn cách bạn muốn AI thực hiện bản dịch.
          - Giữ "Không dùng phương pháp" nếu chỉ cần hướng dẫn của bạn.
        priority:
          title: Ưu tiên hướng dẫn
          points:
          - Chọn hướng dẫn nào quan trọng hơn khi có xung đột.
        workflow:
          title: Quy trình AI
          points:
          - 'Thủ công: bạn tự chọn mô hình dịch.'
          - 'Tự động: một cấu hình đã lưu chạy thêm bước nhận xét và chấm điểm.'
          - Dù chọn cách nào, bạn vẫn là người duyệt bản dịch cuối.
        launch:
          title: Kiểm tra và bắt đầu
          points:
          - Xem lại ai trả tiền và những bước sẽ chạy.
          - Chỉ nút bắt đầu mới gửi việc tới AI.
      source_import:
        intro:
          title: Tải tệp lên
          points:
          - Chuyển tài liệu thành văn bản để bạn kiểm tra.
          - Tải tệp lên không gửi gì tới AI.
        file:
          title: Chọn tệp
          points:
          - Dùng tệp TXT, Markdown, DOCX hoặc PDF.
          - Tệp không được vượt quá giới hạn dung lượng ghi ở đây.
          - Bạn sẽ thấy văn bản trước khi dịch.
      projects:
        intro:
          title: Dự án
          points:
          - Mỗi dự án chứa tài liệu của một cặp ngôn ngữ.
          - Dự án cũng lưu mọi bản dịch làm từ các tài liệu đó.
        list:
          title: Dự án của bạn
          points:
          - Các dự án của bạn hiện ở đây.
          - Mở một dự án để xem tài liệu và tiến độ.
        start:
          title: Thêm việc
          points:
          - Dán văn bản hoặc tải tệp lên.
          - Ngôn ngữ của dự án đã được điền sẵn.
        documents:
          title: Tài liệu
          points:
          - Mỗi tài liệu liệt kê các bản dịch, mới nhất ở trên cùng.
          - Bạn có thể tải lại tệp gốc đã tải lên.
        next_action:
          title: Bước tiếp theo
          points:
          - Liên kết được tô sáng cho biết việc cần làm tiếp.
          - 'Ví dụ: nhận xét, chấm điểm hoặc biên tập.'
      history:
        intro:
          title: Lịch sử dịch
          points:
          - Mọi lượt dịch bạn đã chạy, mới nhất ở trên cùng.
          - Mỗi lượt cho biết trạng thái, mô hình và chi phí AI đã ghi nhận.
        list:
          title: Tìm một bản dịch
          points:
          - Các bản dịch của bạn hiện ở đây, mới nhất trước.
          - Mỗi mục cho biết dự án, ngôn ngữ và hướng dẫn đã dùng.
        reopen:
          title: Tiếp tục hoặc làm lại
          points:
          - Tiếp tục bước kế tiếp, hoặc mở bất kỳ giai đoạn nào.
          - Dùng lại thiết lập của một lượt dịch cho bản dịch mới.
      terminology:
        intro:
          title: Bảng thuật ngữ
          points:
          - Bảng thuật ngữ ghi các cách dịch bạn muốn dùng.
          - Nhờ vậy, các bản dịch luôn dùng từ giống nhau.
        create:
          title: Bảng thuật ngữ mới
          points:
          - Tạo bảng thuật ngữ cho một cặp ngôn ngữ.
        list:
          title: Bảng thuật ngữ của bạn
          points:
          - Chọn một bảng đang hoạt động khi bắt đầu bản dịch.
        entries:
          title: Thuật ngữ
          points:
          - Thêm từng thuật ngữ cùng cách dịch bạn muốn.
          - Mỗi lần lưu sẽ tạo một phiên bản mới.
        revisions:
          title: Phiên bản
          points:
          - Mỗi lần lưu được giữ lại thành một phiên bản.
          - Các bản dịch cũ vẫn giữ phiên bản đã dùng.
        status:
          title: Cập nhật hoặc lưu trữ
          points:
          - Lưu phiên bản mới, hoặc lưu trữ bảng bạn không cần nữa.
          - Lưu trữ vẫn giữ toàn bộ lịch sử.
      references:
        intro:
          title: Bản dịch tham khảo
          points:
          - Mỗi bản tham khảo ghép một đoạn văn gốc với bản dịch bạn đã duyệt.
          - AI sẽ theo cách dùng từ và văn phong đó.
        create:
          title: Bản tham khảo mới
          points:
          - Thêm bản tham khảo cho một cặp ngôn ngữ.
        list:
          title: Bản tham khảo của bạn
          points:
          - Chọn bản cần dùng ở mục Bản dịch tham khảo trong trang Bản dịch mới.
        source:
          title: Văn bản gốc
          points:
          - Dán văn bản gốc, hoặc tải tệp lên.
          - Chỉ dùng một trong hai cách.
        translation:
          title: Bản dịch đã duyệt
          points:
          - Dán hoặc tải lên bản dịch bạn đã duyệt.
          - Tệp sẽ được kiểm tra khi bạn lưu.
        revisions:
          title: Phiên bản
          points:
          - Mỗi lần lưu được giữ lại thành một phiên bản.
          - Các bản dịch cũ vẫn giữ phiên bản đã dùng.
      methodology:
        intro:
          title: Phương pháp
          points:
          - Viết quy tắc dịch một lần.
          - 'Ví dụ: giọng văn, người đọc hoặc cách trình bày.'
        create:
          title: Phương pháp mới
          points:
          - Viết quy tắc một lần, rồi dùng lại cho mọi bản dịch.
        list:
          title: Phương pháp của bạn
          points:
          - Chọn phương pháp cần dùng ở mục Phương pháp trong trang Bản dịch mới.
        instructions:
          title: Quy tắc của bạn
          points:
          - Mô tả bản dịch nên được viết như thế nào.
          - Mỗi lần lưu sẽ tạo một phiên bản mới.
        revisions:
          title: Phiên bản
          points:
          - Các bản dịch cũ vẫn giữ phiên bản đã dùng.
          - Nhờ vậy, bạn luôn biết vì sao kết quả được viết theo cách đó.
      workflows:
        intro:
          title: Cấu hình quy trình
          points:
          - Mỗi cấu hình lưu các mô hình để dịch, nhận xét, chấm điểm và đề xuất chỉnh sửa.
          - Chế độ Tự động ở trang Bản dịch mới sẽ dùng cấu hình này.
        create:
          title: Cấu hình mới
          points:
          - Tạo cấu hình mới, hoặc sao chép một cấu hình rồi chỉnh lại.
        list:
          title: Cấu hình của bạn
          points:
          - Các cấu hình đang hoạt động hiện trong chế độ Tự động ở trang Bản dịch mới.
        configure:
          title: Chọn mô hình
          points:
          - Chọn mô hình cho từng vai trò.
          - Bạn sẽ thấy các việc AI dự kiến làm trước khi bắt đầu.
        completion:
          title: Điểm dừng
          points:
          - Dừng ở bản thắng, hoặc nhận thêm đề xuất của AI.
          - Đề xuất không thay đổi bản nháp, trừ khi bạn áp dụng.
        pipeline:
          title: Tiến độ
          points:
          - Một lượt chạy tự động sẽ dịch, nhận xét rồi chấm điểm.
          - Quy trình dừng lại khi bản nháp sẵn sàng để bạn biên tập.
      ai_settings:
        intro:
          title: Cài đặt AI
          points:
          - Chọn bên trả tiền cho các lượt chạy AI mới.
          - Thao tác trên trang này không chạy AI.
        status:
          title: Trạng thái
          points:
          - Cho biết bạn có thể chạy AI mới hay chưa, và ai sẽ trả tiền.
        source:
          title: Nguồn thanh toán
          points:
          - 'Khóa OpenRouter riêng: OpenRouter tính phí bạn.'
          - 'AI do nền tảng quản lý: Three Heavens trả tiền, sau khi quản trị viên bật quyền cho bạn.'
        key:
          title: Khóa OpenRouter của bạn
          points:
          - Khóa được lưu ở dạng mã hóa.
          - Sau khi lưu, bạn chỉ thấy vài ký tự cuối.
          - Khi bạn thay hoặc xóa khóa, việc của bạn không bao giờ bị chuyển sang khóa của nền tảng.
        billing:
          title: Cách tính phí
          points:
          - Mỗi lượt chạy giữ bên trả tiền được chọn lúc bắt đầu.
          - Thay đổi ở đây chỉ áp dụng cho việc mới.
          - Khi thử lại, bên trả tiền là bên được hiển thị trong khung thử lại.
      results:
        intro:
          title: Kết quả dịch
          points:
          - Theo dõi một bản dịch từ các mô hình đến bước tiếp theo.
        progress:
          title: Tiến độ
          points:
          - Các giai đoạn gồm dịch, nhận xét, chấm điểm và biên tập.
          - Giai đoạn hiện tại được tô sáng.
        outputs:
          title: Bản ứng viên
          points:
          - Xem bản dịch, trạng thái và chi phí đã ghi nhận của từng mô hình.
        retry:
          title: Thử lại phần bị lỗi
          points:
          - Thử lại mô hình bị lỗi khi bạn muốn.
          - Khung này cho biết ai trả tiền cho lần thử lại.
        next:
          title: Bước tiếp theo
          points:
          - Khi có hai bản ứng viên hoàn tất, hãy bắt đầu nhận xét ẩn danh.
      blind_review:
        intro:
          title: Nhận xét ẩn danh
          points:
          - Các mô hình nhận xét sẽ xem xét từng bản ứng viên.
          - Chúng không biết bản nào do mô hình nào viết.
        progress:
          title: Tiến độ
          points:
          - Nhận xét ẩn danh diễn ra sau bước dịch.
        evaluations:
          title: Nhận xét
          points:
          - Đọc nhận xét của từng mô hình cho từng bản ứng viên.
          - Một số nhận xét có gợi ý cách dùng từ.
        retry:
          title: Thử lại lượt nhận xét bị lỗi
          points:
          - Thử lại mô hình nhận xét bị lỗi khi bạn muốn.
          - Khung này cho biết ai trả tiền cho lần thử lại.
        next:
          title: Sang bước chấm điểm
          points:
          - Khi nhận xét xong, hãy chọn mô hình chấm điểm để xếp hạng các bản ứng viên.
      judging:
        intro:
          title: Chấm điểm
          points:
          - Các mô hình chấm điểm sẽ cho điểm và xếp hạng các bản ứng viên đã được nhận xét.
          - Mỗi mô hình chấm độc lập.
        progress:
          title: Tiến độ
          points:
          - Chấm điểm diễn ra sau nhận xét ẩn danh.
          - Tiếp theo là bước biên tập.
        winner:
          title: Bản thắng
          points:
          - Đây là bản ứng viên xếp hạng cao nhất.
          - Mở bản này trong trình biên tập ngay tại đây.
        runs:
          title: Kết quả chấm điểm
          points:
          - Xem lựa chọn, độ tin cậy và lý do của từng mô hình chấm điểm.
        retry:
          title: Thử lại lượt chấm điểm bị lỗi
          points:
          - Thử lại mô hình chấm điểm bị lỗi khi bạn muốn.
          - Khung này cho biết ai trả tiền cho lần thử lại.
      final_editor:
        intro:
          title: Trình biên tập bản dịch cuối
          points:
          - Bạn là người quyết định cuối cùng ở đây.
          - Bản nháp chỉ thay đổi khi chính bạn sửa.
        guidance:
          title: Hướng dẫn dịch đã dùng
          points:
          - Bảng thuật ngữ, phương pháp và bản tham khảo mà bản dịch này đã dùng.
        draft:
          title: Bản nháp của bạn
          points:
          - Chỉnh sửa và lưu các phiên bản.
          - Tải phiên bản hiện tại về dưới dạng TXT hoặc DOCX.
        refine:
          title: Đề xuất của AI
          points:
          - Nhờ mô hình AI gợi ý cách cải thiện phiên bản này.
          - Chỉ áp dụng đề xuất khi bạn muốn.
        revisions:
          title: Lịch sử phiên bản
          points:
          - Mọi phiên bản đã lưu đều được giữ lại.
          - Bạn có thể khôi phục phiên bản cũ thành một phiên bản mới.
        finalize:
          title: Hoàn tất bản dịch
          points:
          - Hoàn tất khi bản dịch đã sẵn sàng.
          - Bạn có thể mở lại sau.
      benchmarks:
        intro:
          title: Thống kê mô hình
          points:
          - Xem mỗi mô hình làm tốt đến đâu trong các bản dịch của bạn.
          - Mỗi điểm trung bình đều ghi rõ số kết quả được dùng để tính.
        sort:
          title: Sắp xếp
          points:
          - Sắp xếp mô hình theo tiêu chí bạn quan tâm.
        list:
          title: Kết quả theo mô hình
          points:
