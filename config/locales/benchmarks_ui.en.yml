      translation_cost: Average translation cost (low to high)
      latency: Average latency (low to high)
    empty: No benchmark history yet
    empty_intro: Models appear after they have participated in a translation experiment.
    diagnostics: Reviewer and judge diagnostics
    diagnostics_intro: Self-score difference is the reviewer’s average score for candidates requested from the same catalog model minus its average for other requested models. It is a diagnostic, not proof of causation. Judge agreement measures agreement with the completed round’s aggregate winner, not objective correctness.
    model_role: Model role
    self_scores: Self scores
    other_scores: Other scores
    self_difference: Self-score difference
    agreement: Aggregate agreement
    metric_notes: Metric notes
    metric_notes_intro: Official win rate = completed judge rounds won ÷ completed judge rounds where the model had an evaluated candidate. Failed and incomplete rounds are excluded. Translation participation and failure rate count logical translation runs, never physical segment calls. Quality averages use non-null scores from completed reviewer or judge runs. Cost, tokens, and latency use completed translation runs only; latency requires both timestamps and a nonnegative duration.
    cost_note: Cost per judge-score point is calculated per completed positive-cost translation run as cost ÷ that run’s mean completed judge score, then averaged across eligible runs. Zero-cost and unjudged runs are excluded.
    all: ← All benchmarks
    summary: Summary
    role_diagnostics: Role diagnostics
    role_intro: Reviewer identity comparisons use the requested catalog model, not the provider-resolved identifier. Differences are descriptive and do not establish causation. Judge agreement is agreement with the aggregate outcome, not objective correctness.
    self_difference_heading: Potential self-review scoring difference
