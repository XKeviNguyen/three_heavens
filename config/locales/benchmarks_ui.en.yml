    title: Model benchmarks · Three Heavens
    show_title: '%{name} benchmark · Three Heavens'
    heading: Model benchmark leaderboard
    intro: Grouped by the requested catalog model, including inactive models with translation history. Every average and rate includes its sample count; missing telemetry remains N/A.
    sort_by: Sort by
    sort_button: Sort
    sort:
      judge_samples: Judge score samples (high to low)
