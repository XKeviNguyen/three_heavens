en:
  product_tour:
    ui:
      help: Help
      full_tour: Full product tour
      page_tour: Tour this page
      next: Next
      back: Back
      skip: Skip tour
      finish: Finish
      close: Close tour
      step_counter: "%{current} of %{total}"
      start_translation: Start a new translation
      refreshing: "This page refreshes while AI work runs. Tours are available once it finishes."
      invite:
        title: New to Three Heavens?
        body: Take a seven-step tour of how translation, review, and your knowledge library fit together. It changes nothing, and Help can replay it any time.
        start: Take the tour
        later: Not now
    global:
      welcome:
        title: Welcome to Three Heavens
        body: An AI-assisted translation workspace. Several models translate, other models review and judge the results independently, and you make the final editorial decisions, backed by the terminology and examples you keep.
      workspace:
        title: Your workspace
        body: Start new work from New translation. Projects keep each language pair's documents and their runs together, and History lists every translation run, newest first, so you can reopen any of them.
      knowledge:
        title: Translation knowledge
        body: Glossaries hold preferred terms, References hold translations you already approve, and Methodology holds reusable instructions. Choose them when you start a translation to keep wording and style consistent.
      workflows:
        title: Workflow setups
        body: Save which models translate, review, judge, and suggest improvements. Choose a saved setup in Automatic mode and the pipeline runs translation, blind review, and judging for you, then stops so you can edit.
      ai_access:
        title: AI access and who pays
        body: In AI settings you choose who pays for new AI work. Your own OpenRouter key bills your OpenRouter account. Platform-managed AI is paid by the platform and needs an administrator's approval. You can finish this tour without adding a key.
      start:
        title: Start a translation
        body: Choose the source and target languages, paste text or upload a TXT, Markdown, DOCX, or PDF file, add optional guidance, and pick models or a workflow setup. Nothing is sent to AI until you start it yourself.
      quality:
        title: From candidates to a final translation
        body: Each model's translation becomes a candidate. Reviewers evaluate the candidates without seeing which model wrote them, judges rank them, and the winner opens in the editor, where you revise, compare versions, finalize, and download TXT or DOCX.
    pages:
      new_translation:
        intro:
          title: New translation
          body: This page collects everything one translation run needs. Nothing starts, and nothing is charged, until you choose to start it.
        languages:
          title: Project and languages
          body: Pick an existing project, or name a new one with its source and target languages. A project keeps one language pair.
        source:
          title: Source document
          body: Paste the text, or switch to Upload for a TXT, Markdown, DOCX, or PDF file. You can review and edit the extracted text before starting.
        knowledge:
          title: Optional guidance
          body: Select a glossary for preferred terms. Advanced options add approved references, a methodology, and which guidance takes priority.
        workflow:
          title: AI workflow
          body: In Manual mode you choose the translator models. In Automatic mode a saved workflow setup runs review and judging too. Either way, you approve the final translation.
        launch:
          title: Review and start
          body: Check who pays for this run and what it will do, then start it. The start button is the only control here that sends work to AI.
      source_import:
        intro:
          title: Upload a source file
          body: Upload one document to turn it into reviewable source text. Uploading and previewing never sends anything to AI.
        file:
          title: Choose or drop a file
          body: TXT, Markdown, DOCX, and PDF files are supported, within the size limit shown. The extracted text is shown for you to check before you translate it.
      projects:
        intro:
          title: Projects
          body: A project groups the documents of one language pair and every translation run made from them.
        list:
          title: Your projects
          body: Open a project to see its documents and where each run stands.
        start:
          title: Add work to this project
          body: Paste new source text or upload a file; the project's languages are filled in for you.
        documents:
          title: Documents
          body: Each document lists its runs, newest first. Uploaded originals can be downloaded again.
        next_action:
          title: Pick up where you left off
          body: The highlighted link always points to the next useful step for that run, such as blind review, judging, or the editor.
      history:
        intro:
          title: Translation history
          body: Every translation run you made, newest first, with its status, models, and known AI cost.
        list:
          title: Find a run
          body: Each entry shows its project, languages, and the guidance it used.
        reopen:
          title: Reopen or repeat
          body: Continue with the next step, open any stage, or repeat a run's configuration as a new translation.
      terminology:
        intro:
          title: Glossaries
          body: A glossary lists preferred terms for one language pair, so every translation uses the same wording.
        create:
          title: Create a glossary
          body: Start a new glossary for a language pair.
        list:
          title: Your glossaries
          body: Active glossaries can be chosen when you start a translation.
        entries:
          title: Terms
          body: Add each source term with its preferred translation. Saving creates a new revision.
        revisions:
          title: Revisions
          body: Every saved change is a revision. Runs keep the exact revision they used, even after you edit the glossary.
        status:
          title: Revise or archive
          body: Create a new revision, or archive a glossary you no longer offer for new work. Archiving keeps its history.
      references:
        intro:
          title: Translation references
          body: A reference pairs a source passage with a translation you already approve, so AI can follow your established wording and style.
        create:
          title: Add a reference
          body: Create a reference for one language pair.
        list:
          title: Your references
          body: Active references can be chosen in the advanced options of a new translation.
        source:
          title: Source example
          body: Paste the source passage or upload one file. Provide pasted text or a file, not both.
        translation:
          title: Approved translation
          body: Paste or upload the translation you approve for that passage. Files are checked and extracted when you save.
        revisions:
          title: Revision history
          body: Each save is a revision. Translation runs keep the revision they used.
      methodology:
        intro:
          title: Methodology
          body: A methodology is reusable written guidance on how translations should be produced, such as tone, audience, or formatting rules.
        create:
          title: Create a methodology
          body: Write guidance once and reuse it across translations.
        list:
          title: Your methodologies
          body: Active methodologies can be chosen in the advanced options of a new translation.
        instructions:
          title: Guidance
          body: Describe how the translation should read. Saving creates a new revision.
        revisions:
          title: Revisions
          body: Runs keep the exact revision they used, so past results stay explainable.
      workflows:
        intro:
          title: Workflow setups
          body: A workflow setup saves which models translate, review, judge, and suggest improvements, for use in Automatic mode.
        create:
          title: Create a setup
          body: Start a new setup, or duplicate an existing one to adjust it.
        list:
          title: Your setups
          body: Active setups appear in Automatic mode on the New translation page.
        configure:
          title: Choose the models
          body: Pick models for each role. Automatic runs use exactly these models and show the planned AI work before you start.
        completion:
          title: When to stop
          body: Stop at the winning draft, or also collect AI suggestions. Suggestions never change your draft unless you apply them.
        pipeline:
          title: Pipeline progress
          body: An automatic run moves through translation, blind review, and judging, then stops when it is ready for you to edit.
      ai_settings:
        intro:
          title: AI settings
          body: Choose who pays for new AI work. Nothing on this page starts AI work.
        status:
          title: Current status
          body: Shows whether new AI work can start and who pays for it.
        source:
          title: Payment source
          body: Your own OpenRouter key bills your OpenRouter account. Platform-managed AI is paid by the platform and needs an administrator's approval.
        key:
          title: Your OpenRouter key
          body: The key is stored encrypted and never shown again; only its last characters appear. Replacing or deleting it never moves your work to the platform's key.
        billing:
          title: How billing works
          body: Each run records who pays when it starts. Changing this setting affects new work only, and an explicit retry uses the payer shown next to it.
      results:
        intro:
          title: Translation results
          body: This page follows one translation run from its models to the next step.
        progress:
          title: Where this run stands
          body: Translation, blind review, judging, and the editor, with the current stage highlighted.
        outputs:
          title: Translation candidates
          body: Each model's output, status, and known cost.
        retry:
          title: Recover failed work
          body: Failed models can be retried explicitly. The panel shows who will pay for that retry.
        next:
          title: Next step
          body: When at least two candidates are complete, start a blind review, or continue to the existing one.
      blind_review:
        intro:
          title: Blind review
          body: Reviewer models evaluate the candidates without knowing which model wrote them.
        progress:
          title: Workflow progress
          body: Blind review is the second stage, after translation.
        evaluations:
          title: Reviews
          body: Each reviewer's structured feedback per candidate, including suggested wording where offered.
        retry:
          title: Recover failed reviews
          body: Failed reviewers can be retried explicitly. The panel shows who will pay for that retry.
        next:
          title: Continue to judging
          body: When the review is complete, choose judge models to rank the candidates.
      judging:
        intro:
          title: Judging
          body: Judge models independently score and rank the reviewed candidates.
        progress:
          title: Workflow progress
          body: Judging is the third stage; the editor follows.
        winner:
          title: The winner
          body: The overall winner and the way to open it in the final editor.
        runs:
          title: Judge results
          body: Each judge's chosen winner, confidence, rationale, strengths, and risks, so you can see how the result was reached.
        retry:
          title: Recover failed judges
          body: Failed judges can be retried explicitly. The panel shows who will pay for that retry.
      final_editor:
        intro:
          title: Final editor
          body: You make the final decisions here. Nothing changes your draft unless you do it.
        guidance:
          title: Guidance used
          body: The glossary, methodology, and references this run used, for checking as you edit.
        draft:
          title: Your draft
          body: Edit and save versions. Download the current version as TXT or DOCX at any time.
        refine:
          title: AI suggestions
          body: Ask suggestion models for improvements to the current version. Apply a suggestion only if you want it.
        revisions:
          title: Revision history
          body: Every saved version is kept. Restore an earlier one as a new draft version.
        finalize:
          title: Finalize
          body: Finalize the current version when it is ready; you can reopen it later if needed.
      benchmarks:
        intro:
          title: Model benchmarks
          body: How each model has performed in your own runs. Every average shows how many results it is based on.
        sort:
          title: Sort the models
          body: Order models by the measure you care about.
        list:
          title: Model results
          body: Open a model for its role diagnostics and recent history.
        roles:
          title: Role diagnostics
          body: How the model behaved as a reviewer or judge. Differences describe what happened; they do not prove a cause.
  file_field:
    choose: Choose file
    replace: Choose a different file
    remove: Remove
    remove_named: Remove %{name}
    drop: or drop a file here
    none: No file selected.
    help: "TXT, Markdown, DOCX, or PDF · up to %{maximum} MiB · checked again when you save"
    selected: "%{name} selected (%{size})."
    removed: File removed.
    unsupported: "%{name} is not a supported file. Choose a TXT, Markdown, DOCX, or PDF file."
    too_large: "%{name} is larger than the upload limit."
    multiple: Choose one file only.
    both: You also pasted text above. Remove the text or the file before saving; only one can be used.
