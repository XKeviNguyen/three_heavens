en:
  product_tour:
    ui:
      help: Help
      full_tour: Product tour
      page_tour: Guide to this page
      page_guides: Show page guides automatically
      page_guides_on: 'On'
      page_guides_off: 'Off'
      next: Next
      back: Back
      skip: Skip
      finish: Done
      close: Close guide
      step_counter: "%{current} of %{total}"
      start_translation: Start a new translation
      refreshing: This page updates while AI work runs. Guides open when it's done.
      auto_note: Shown once. Replay it or turn these off under Help.
      invite:
        title: New to Three Heavens?
        body: Take a quick look at how everything fits together. It won't change anything.
        start: Take the tour
        later: Not now
    global:
      welcome:
        title: Welcome to Three Heavens
        points:
        - AI models translate your text.
        - Other models review and rank each translation.
        - You make the final decisions.
      workspace:
        title: Your workspace
        points:
        - Start new work from New translation.
        - Projects keep documents for one language pair together.
        - History lists every translation, newest first.
      knowledge:
        title: Your translation library
        points:
        - Glossaries keep your terms consistent.
        - References show translations you've already approved.
        - Methodology tells the AI how you want it to write.
      workflows:
        title: Workflow setups
        points:
        - Save which models translate, review, and judge.
        - In Automatic mode, a setup runs each step for you.
        - It stops before the final edit, so you stay in control.
      ai_access:
        title: AI access and payment
        points:
        - Choose who pays for new AI work in AI settings.
        - With your own OpenRouter key, OpenRouter bills you.
        - With platform-managed AI, Three Heavens pays. An admin must turn it on for you.
      start:
        title: Start a translation
        points:
        - Choose the languages, then add your text or a file.
        - Pick the AI models or a workflow setup.
        - Nothing goes to the AI until you start it.
      quality:
        title: From drafts to a final translation
        points:
        - Each model's translation becomes a candidate.
        - Reviewers and judges compare the candidates and pick a winner.
        - The winner opens in the editor, where you finish and download it.
    pages:
      new_translation:
        intro:
          title: New translation
          points:
          - Set up one translation on this page.
          - Nothing starts, and nothing costs money, until you start it.
        languages:
          title: Project and languages
          points:
          - Pick a project, or name a new one.
          - Each project uses one language pair.
        source:
          title: Your text
          points:
          - Paste text, or upload a TXT, Markdown, DOCX, or PDF file.
          - You can check the text before you start.
        terminology:
          title: Terminology
          points:
          - Use the terms you want the AI to translate the same way every time.
          - Pick a saved glossary, or add terms here.
        references:
          title: Translation references
          points:
          - Choose example translations you have already approved.
          - The AI follows their wording and style.
        methodology:
          title: Methodology
          points:
          - Choose how you want the AI to write the translation.
          - Keep "No methodology" to use only your own instructions.
        priority:
          title: Guidance priority
          points:
          - Choose which guidance wins when they disagree.
        workflow:
          title: AI workflow
          points:
          - 'Manual: you choose the translation models.'
          - 'Automatic: a saved setup also runs review and judging.'
          - Either way, you approve the final translation.
        launch:
          title: Review and start
          points:
          - Check who pays and what will run.
          - Only the start button sends work to the AI.
      source_import:
        intro:
          title: Upload a file
          points:
          - Turn a document into text you can check.
          - Uploading never sends anything to the AI.
        file:
          title: Choose a file
          points:
          - Use a TXT, Markdown, DOCX, or PDF file.
          - Keep it under the size limit shown here.
          - You'll see the text before you translate it.
      projects:
        intro:
          title: Projects
          points:
          - A project holds documents for one language pair.
          - It also keeps every translation made from them.
        list:
          title: Your projects
          points:
          - Your projects appear here.
          - Open one to see its documents and progress.
        start:
          title: Add work
          points:
          - Paste text or upload a file.
          - The project's languages are filled in for you.
        documents:
          title: Documents
          points:
          - Each document lists its translations, newest first.
          - You can download uploaded originals again.
        next_action:
          title: What's next
          points:
          - The highlighted link shows the next step.
          - 'For example: review, judging, or the editor.'
      history:
        intro:
          title: Translation history
          points:
          - Every translation you've run, newest first.
          - Each one shows its status, models, and known AI cost.
        list:
          title: Find a translation
          points:
          - Your translations appear here, newest first.
          - Each one shows its project, languages, and guidance.
        reopen:
          title: Continue or repeat
          points:
          - Continue with the next step, or open any stage.
          - Reuse a run's settings for a new translation.
      terminology:
        intro:
          title: Glossaries
          points:
          - A glossary lists your preferred terms.
          - Translations then use the same wording every time.
        create:
          title: New glossary
          points:
          - Create a glossary for one language pair.
        list:
          title: Your glossaries
          points:
          - Pick an active glossary when you start a translation.
        entries:
          title: Terms
          points:
          - Add each term with its preferred translation.
          - Each save creates a new version.
        revisions:
          title: Versions
          points:
          - Every save is kept as a version.
          - Past translations keep the version they used.
        status:
          title: Update or archive
          points:
          - Save a new version, or archive a glossary you no longer need.
          - Archiving keeps its history.
      references:
        intro:
          title: References
          points:
          - A reference pairs a source text with a translation you've approved.
          - The AI follows its wording and style.
        create:
          title: New reference
          points:
          - Add a reference for one language pair.
        list:
          title: Your references
          points:
          - Pick the ones to follow under Translation references in New translation.
        source:
          title: Source text
          points:
          - Paste the source text, or upload a file.
          - Use one or the other, not both.
        translation:
          title: Approved translation
          points:
          - Paste or upload the translation you approve.
          - Files are checked when you save.
        revisions:
          title: Versions
          points:
          - Every save is kept as a version.
          - Past translations keep the version they used.
      methodology:
        intro:
          title: Methodology
          points:
          - Write your translation rules once.
          - 'For example: tone, audience, or formatting.'
        create:
          title: New methodology
          points:
          - Write rules once, then reuse them in any translation.
        list:
          title: Your methodologies
          points:
          - Pick one to follow under Methodology in New translation.
        instructions:
          title: Your rules
          points:
          - Describe how the translation should read.
          - Each save creates a new version.
        revisions:
          title: Versions
          points:
          - Past translations keep the version they used.
          - So you can always see why a result reads the way it does.
      workflows:
        intro:
          title: Workflow setups
          points:
          - A setup saves which models translate, review, judge, and suggest edits.
          - Automatic mode on New translation uses it.
        create:
          title: New setup
          points:
          - Create a setup, or copy one and change it.
        list:
          title: Your setups
          points:
          - Active setups appear in Automatic mode on New translation.
        configure:
          title: Choose the models
          points:
          - Pick models for each role.
          - You'll see the planned AI work before anything starts.
        completion:
          title: Where to stop
          points:
          - Stop at the winning draft, or also get AI suggestions.
          - Suggestions never change your draft unless you apply them.
        pipeline:
          title: Progress
          points:
          - An automatic run translates, reviews, and judges.
          - It stops when the draft is ready for you to edit.
      ai_settings:
        intro:
          title: AI settings
          points:
          - Choose who pays for new AI work.
          - Nothing on this page starts AI work.
        status:
          title: Status
          points:
          - Shows whether new AI work can start, and who pays.
        source:
          title: Payment source
          points:
          - 'Your own OpenRouter key: OpenRouter bills you.'
          - 'Platform-managed AI: Three Heavens pays, once an admin turns it on for you.'
        key:
          title: Your OpenRouter key
          points:
          - Your key is stored encrypted.
          - After you save it, only its last few characters are shown.
          - Replacing or deleting it never moves your work to the platform's key.
        key_status:
          title: Key check
          points:
          - Saving a key checks it with OpenRouter.
          - Here you see whether OpenRouter accepts it, and its credit limit.
        billing:
          title: How billing works
          points:
          - Each run keeps the payer chosen when it started.
          - Changes here only affect new work.
          - A retry uses the payer shown next to it.
      results:
        intro:
          title: Translation results
          points:
          - Follow one translation from the models to the next step.
        progress:
          title: Progress
          points:
          - The stages are translation, review, judging, and editing.
          - The current stage is highlighted.
        outputs:
          title: Candidates
          points:
          - See each model's translation, status, and known cost.
        retry:
          title: Retry failed work
          points:
          - Retry a failed model when you choose to.
          - The panel shows who pays for the retry.
        next:
          title: Next step
          points:
          - When two candidates are ready, start a blind review.
          - Pick reviewers from the whole OpenRouter catalog, not only the models that translated.
          - Only models that can return structured answers are offered.
      blind_review:
        intro:
          title: Blind review
          points:
          - Reviewer models check each candidate.
          - They don't see which model wrote it.
        progress:
          title: Progress
          points:
          - Blind review comes after translation.
        scores:
          title: Average scores
          points:
          - The gauge shows the average of all candidates.
          - 'Each tile shows one model''s average and how far it is from that average.'
        evaluations:
          title: Reviews
          points:
          - Read each reviewer's feedback on each candidate.
          - Some include suggested wording.
        retry:
          title: Retry failed reviews
          points:
          - Retry a failed reviewer when you choose to.
          - The panel shows who pays for the retry.
        replace:
          title: Replace a failed reviewer
          points:
          - Swap a failed reviewer for another model, until judging starts.
          - 'Only the new model''s work is billed. The failed one keeps its own cost.'
        next:
          title: Go to judging
          points:
          - When the reviews are done, pick judge models from the OpenRouter catalog to rank the candidates.
      judging:
        intro:
          title: Judging
          points:
          - Judge models score and rank the reviewed candidates.
          - Each judge works on its own.
        progress:
          title: Progress
          points:
          - Judging comes after blind review.
          - The editor comes next.
        scores:
          title: Average scores
          points:
          - 'The gauge shows the judges'' average for all candidates.'
          - 'Each tile shows one model''s average; the winner also depends on the ranks.'
        winner:
          title: The winner
          points:
          - This is the top-ranked candidate.
          - Open it in the editor from here.
        runs:
          title: Judge results
          points:
          - See each judge's pick, confidence, and reasons.
        retry:
          title: Retry failed judges
          points:
          - Retry a failed judge when you choose to.
          - The panel shows who pays for the retry.
        replace:
          title: Replace a failed judge
          points:
          - Swap a failed judge for another model, until the editor is opened.
          - 'Only the new model''s work is billed. The failed one keeps its own cost.'
      final_editor:
        intro:
          title: Final editor
          points:
          - You make the final decisions here.
          - Nothing changes your draft unless you change it.
        guidance:
          title: Guidance used
          points:
          - The glossary, methodology, and references this translation used.
        draft:
          title: Your draft
          points:
          - Edit and save versions.
          - Download the current version as TXT or DOCX.
        refine:
          title: AI suggestions
          points:
          - Pick AI models from the OpenRouter catalog for ideas to improve this version.
          - Use a suggestion only if you want it.
        revisions:
          title: Version history
          points:
          - Every saved version is kept.
          - Restore an earlier one as a new version.
        finalize:
          title: Finalize
          points:
          - Finalize when the translation is ready.
          - You can reopen it later.
      benchmarks:
        intro:
          title: Model benchmarks
          points:
          - See how each model did in your own translations.
          - Each average shows how many results it's based on.
        sort:
          title: Sort
          points:
          - Sort the models by what matters to you.
        list:
          title: Model results
          points:
          - Open a model to see its details and recent work.
        roles:
          title: Reviewer and judge details
          points:
          - See how the model did as a reviewer or judge.
          - Differences show what happened, not why.
  file_field:
    choose: Choose file
    replace: Choose a different file
    remove: Remove
    remove_named: Remove %{name}
    drop: or drop a file here
    none: No file selected.
    help: TXT, Markdown, DOCX, or PDF · up to %{maximum} MiB · checked again when you save
    selected: "%{name} selected (%{size})."
    removed: File removed.
    unsupported: "%{name} is not a supported file. Choose a TXT, Markdown, DOCX, or PDF file."
    too_large: "%{name} is larger than the upload limit."
    multiple: Choose one file only.
    both: You also pasted text above. Remove the text or the file before saving; only one can be used.
