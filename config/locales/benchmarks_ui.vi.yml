vi:
  benchmarks_ui:
    title: Thống kê mô hình · Three Heavens
    show_title: Thống kê %{name} · Three Heavens
    heading: Bảng thống kê mô hình
    intro: Nhóm theo mô hình đã chọn, kể cả mô hình đã tắt nhưng có lịch sử dịch. Mỗi giá trị trung bình và tỷ lệ có số mẫu; dữ liệu thiếu được ghi rõ.
    sort_by: Sắp xếp theo
    sort_button: Sắp xếp
    sort:
      judge_samples: Số mẫu điểm chấm (nhiều đến ít)
      wins: Số lần thắng chính thức (nhiều đến ít)
      win_rate: Tỷ lệ thắng chính thức (cao đến thấp)
      review_score: Điểm nhận xét ẩn danh (cao đến thấp)
      judge_score: Điểm chấm (cao đến thấp)
      translation_cost: Chi phí dịch trung bình (thấp đến cao)
      latency: Độ trễ trung bình (thấp đến cao)
    empty: Chưa có dữ liệu thống kê
    empty_intro: Mô hình sẽ xuất hiện sau khi tham gia một lần dịch.
    diagnostics: Phân tích mô hình nhận xét và chấm điểm
    diagnostics_intro: Chênh lệch điểm tự đánh giá là điểm trung bình mô hình nhận xét chấm cho bản dịch từ chính mô hình đó trừ điểm cho các mô hình khác. Đây chỉ là chỉ số tham khảo, không chứng minh nguyên nhân. Mức đồng thuận của mô hình chấm là với kết quả tổng hợp, không phải thước đo đúng sai khách quan.
    model_role: Vai trò mô hình
    self_scores: Điểm cho chính mình
    other_scores: Điểm cho mô hình khác
    self_difference: Chênh lệch điểm tự đánh giá
    agreement: Đồng thuận với tổng hợp
    metric_notes: Ghi chú chỉ số
    metric_notes_intro: Tỷ lệ thắng = số vòng chấm đã hoàn tất mà mô hình thắng ÷ số vòng đã hoàn tất có ứng viên của mô hình. Không tính vòng thất bại hay chưa xong. Số lần tham gia và tỷ lệ thất bại tính theo lượt dịch, không theo yêu cầu từng đoạn. Điểm chất lượng dùng các điểm hợp lệ từ lượt nhận xét hoặc chấm đã xong. Chi phí, token và độ trễ chỉ dùng lượt dịch đã hoàn tất; độ trễ cần đủ hai mốc thời gian và không âm.
    cost_note: Chi phí trên mỗi điểm chấm được tính cho từng lượt dịch đã hoàn tất có chi phí dương bằng chi phí ÷ điểm chấm trung bình, rồi lấy trung bình các lượt đủ điều kiện. Không tính lượt miễn phí hoặc chưa được chấm.
    all: ← Tất cả thống kê
    summary: Tổng quan
    role_diagnostics: Phân tích theo vai trò
    role_intro: So sánh danh tính mô hình nhận xét dùng mô hình đã chọn, không dùng mã mô hình thực tế từ nhà cung cấp. Chênh lệch chỉ mô tả dữ liệu, không chứng minh nguyên nhân. Mức đồng thuận là với kết quả tổng hợp, không phải tính đúng đắn khách quan.
    self_difference_heading: Chênh lệch điểm khi tự nhận xét
    self: Chính mình
    other: Mô hình khác
    difference: Chênh lệch
    no_review_scores: Không có dữ liệu · chưa có điểm nhận xét đã hoàn tất.
