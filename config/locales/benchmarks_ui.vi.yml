    resolved_intro: OpenRouter có thể dùng một mã mô hình thực tế khác với mã đã chọn. Giá trị thiếu hoặc không được báo cáo sẽ được ghi rõ. Tổng chi phí bên dưới chỉ gồm lượt dịch đã hoàn tất có báo cáo chi phí.
