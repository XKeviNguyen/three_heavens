ja:
  product_tour:
    ui:
      help: 使い方
      full_tour: Three Heavensの使い方
      page_tour: この画面の使い方
      page_guides: 画面ごとの使い方を自動で表示
      page_guides_on: オン
      page_guides_off: オフ
      next: 次へ
      back: 戻る
      skip: スキップ
      finish: 完了
      close: 閉じる
      step_counter: "%{current} / %{total}"
      start_translation: 新しい翻訳を始める
      refreshing: AIの処理中は、この画面が自動で更新されます。処理が終わると使い方を開けます。
      auto_note: 自動で表示されるのは一度だけです。「使い方」から見直したり、自動表示をオフにしたりできます。
      invite:
        title: Three Heavensは初めてですか？
        body: 全体の流れを手短にご紹介します。設定やデータは何も変わりません。
        start: 使い方を見る
        later: あとで
    global:
      welcome:
        title: Three Heavensへようこそ
        points:
        - 複数のAIモデルが原文を翻訳します。
        - 別のモデルが訳文をレビューし、順位をつけます。
        - 最終的な判断は、ご自身で行います。
      workspace:
        title: ワークスペース
        points:
        - 新しい作業は「新しい翻訳」から始めます。
        - プロジェクトでは、同じ言語ペアの文書をまとめて管理します。
        - "「履歴」には、すべての翻訳が新しい順に並びます。"
      knowledge:
        title: 翻訳の資料
        points:
        - 用語集を使うと、訳語をそろえられます。
        - 参考訳は、承認した訳文をAIのお手本にします。
        - 翻訳方針で、AIに文体や書き方を伝えます。
      workflows:
        title: ワークフロー設定
        points:
        - 翻訳・レビュー・判定に使うモデルを保存できます。
        - 自動モードでは、設定どおりに各工程を進めます。
        - 最終編集の前で止まるので、最後はご自身で確認できます。
      ai_access:
        title: AIの利用と支払い
        points:
        - 新しいAI処理の費用を誰が支払うかは、「AI設定」で選びます。
        - 自分のOpenRouterキーなら、OpenRouterから請求されます。
        - プラットフォーム管理のAIは、Three Heavensが支払います。管理者がアカウントで有効にする必要があります。
      start:
        title: 翻訳を始める
        points:
        - 言語を選び、原文を貼り付けるかファイルを追加します。
        - AIモデルかワークフロー設定を選びます。
        - 開始するまで、AIには何も送られません。
      quality:
        title: 候補から最終訳まで
        points:
        - 各モデルの訳文が「候補」になります。
        - レビューと判定で候補を比べ、採用する訳を決めます。
        - 採用された訳はエディターで仕上げ、ダウンロードできます。
    pages:
      new_translation:
        intro:
          title: 新しい翻訳
          points:
          - この画面で、翻訳を1件設定します。
          - 開始するまで、処理も課金も始まりません。
        languages:
          title: プロジェクトと言語
          points:
          - 既存のプロジェクトを選ぶか、新しいプロジェクト名を入力します。
          - 1つのプロジェクトで使う言語ペアは1組です。
        source:
          title: 原文
          points:
          - 原文を貼り付けるか、TXT・Markdown・DOCX・PDFファイルをアップロードします。
          - 開始する前に、内容を確認できます。
        knowledge:
          title: 任意の指示
          points:
          - 用語集を選ぶと、訳語をそろえられます。
          - 詳細オプションでは、参考訳と翻訳方針も追加できます。
        workflow:
          title: AIワークフロー
          points:
          - 手動：翻訳に使うモデルを自分で選びます。
          - 自動：保存した設定で、レビューと判定まで進めます。
          - どちらの場合も、最終訳はご自身で承認します。
        launch:
          title: 確認して開始
          points:
          - 誰が支払うか、何が実行されるかを確認します。
          - 開始ボタンを押すまで、AIには何も送られません。
      source_import:
        intro:
          title: ファイルのアップロード
          points:
          - 文書をテキストにして、内容を確認できます。
          - アップロードしても、AIには何も送られません。
        file:
          title: ファイルを選ぶ
          points:
          - TXT・Markdown・DOCX・PDFファイルに対応しています。
          - ここに表示されているサイズ上限までです。
          - 翻訳する前に、テキストを確認できます。
      projects:
        intro:
          title: プロジェクト
          points:
          - 1つの言語ペアの文書をまとめます。
          - それらの文書から作った翻訳も、すべて残ります。
        list:
          title: プロジェクト一覧
          points:
          - プロジェクトを開くと、文書と進み具合を確認できます。
        start:
          title: 作業を追加
          points:
          - 原文を貼り付けるか、ファイルをアップロードします。
          - プロジェクトの言語は自動で入ります。
        documents:
          title: 文書
          points:
          - 文書ごとに、翻訳が新しい順に並びます。
          - アップロードした元のファイルは、もう一度ダウンロードできます。
        next_action:
          title: 次にすること
          points:
          - 強調表示されたリンクが、次の手順を示します。
          - たとえば、レビュー、判定、エディターなどです。
      history:
        intro:
          title: 翻訳履歴
          points:
          - これまでの翻訳が、新しい順に並びます。
          - それぞれの状態、モデル、判明しているAI費用を表示します。
        list:
          title: 翻訳を探す
          points:
          - 各項目に、プロジェクト、言語、使った指示が表示されます。
        reopen:
          title: 続きから・もう一度
          points:
          - 次の手順に進むか、好きな工程を開けます。
          - 同じ設定で新しい翻訳を始めることもできます。
      terminology:
        intro:
          title: 用語集
          points:
          - 使いたい訳語をまとめておく一覧です。
          - どの翻訳でも、同じ訳語が使われます。
        create:
          title: 用語集を作成
          points:
          - 言語ペアごとに用語集を作ります。
        list:
          title: 用語集一覧
          points:
          - 有効な用語集は、翻訳の開始時に選べます。
        entries:
          title: 用語
          points:
          - 用語と、使いたい訳語を1つずつ追加します。
          - 保存するたびに、新しい版ができます。
        revisions:
          title: 版
          points:
          - 保存した内容は、版としてすべて残ります。
          - 過去の翻訳は、そのとき使った版のままです。
        status:
          title: 更新・アーカイブ
          points:
          - 新しい版を保存するか、使わなくなった用語集をアーカイブします。
          - アーカイブしても、履歴は残ります。
      references:
        intro:
          title: 参考訳
          points:
          - 原文と、承認済みの訳文を組にしたものです。
          - AIは、その言葉づかいや文体にならいます。
        create:
          title: 参考訳を追加
          points:
          - 言語ペアごとに参考訳を追加します。
        list:
          title: 参考訳一覧
          points:
          - 有効な参考訳は、新しい翻訳の詳細オプションで選べます。
        source:
          title: 原文
          points:
          - 原文を貼り付けるか、ファイルをアップロードします。
          - どちらか一方だけを使います。
        translation:
          title: 承認済みの訳文
          points:
          - 承認した訳文を貼り付けるか、アップロードします。
          - ファイルは保存時に確認されます。
        revisions:
          title: 版
          points:
          - 保存した内容は、版としてすべて残ります。
          - 過去の翻訳は、そのとき使った版のままです。
      methodology:
        intro:
          title: 翻訳方針
          points:
          - 翻訳のルールをまとめておけます。
          - たとえば、文体、読み手、書式などです。
        create:
          title: 翻訳方針を作成
          points:
          - 一度書いたルールを、どの翻訳でも使い回せます。
        list:
          title: 翻訳方針一覧
          points:
          - 有効な翻訳方針は、新しい翻訳の詳細オプションで選べます。
        instructions:
          title: ルール
          points:
          - どんな訳文にしたいかを書きます。
          - 保存するたびに、新しい版ができます。
        revisions:
          title: 版
          points:
          - 過去の翻訳は、そのとき使った版のままです。
          - そのため、結果がなぜその訳になったのかを後から確認できます。
      workflows:
        intro:
          title: ワークフロー設定
          points:
          - 翻訳・レビュー・判定・修正案に使うモデルを保存します。
          - "「新しい翻訳」の自動モードで使われます。"
        create:
          title: 設定を作成
          points:
          - 新しく作るか、既存の設定を複製して変更します。
        list:
          title: 設定一覧
          points:
          - 有効な設定は、「新しい翻訳」の自動モードに表示されます。
        configure:
          title: モデルを選ぶ
          points:
          - 役割ごとにモデルを選びます。
          - 開始する前に、予定されているAIの処理を確認できます。
        completion:
          title: どこまで進めるか
          points:
          - 採用された訳で止めるか、AIの修正案まで受け取るかを選びます。
          - 修正案は、適用しない限り下書きを変えません。
        pipeline:
          title: 進み具合
          points:
          - 自動実行では、翻訳・レビュー・判定の順に進みます。
          - 下書きの編集ができる状態になると止まります。
      ai_settings:
        intro:
          title: AI設定
          points:
          - 新しいAI処理の費用を誰が支払うかを選びます。
          - この画面では、AIの処理は始まりません。
        status:
          title: 現在の状態
          points:
          - 新しいAIの処理を始められるか、誰が支払うかを表示します。
        source:
          title: 支払い元
          points:
          - 自分のOpenRouterキー：OpenRouterから請求されます。
          - プラットフォーム管理のAI：管理者が有効にすると、Three Heavensが支払います。
        key:
          title: OpenRouterキー
          points:
          - キーは暗号化して保存されます。
          - 保存後は末尾の数文字だけが表示されます。
          - 置き換えや削除をしても、作業がプラットフォームのキーに切り替わることはありません。
        billing:
          title: 課金の仕組み
          points:
          - 支払い元は、処理を開始した時点のものが使われます。
          - ここでの変更は、新しい処理にだけ反映されます。
          - 再試行では、ボタンの横に表示された支払い元が使われます。
      results:
        intro:
          title: 翻訳結果
          points:
          - 1件の翻訳について、各モデルの結果から次の手順までを確認できます。
        progress:
          title: 進み具合
          points:
          - 工程は、翻訳、レビュー、判定、編集の順です。
          - 今の工程が強調表示されます。
        outputs:
          title: 候補
          points:
          - 各モデルの訳文、状態、判明している費用を確認できます。
        retry:
          title: 失敗した処理の再試行
          points:
          - 失敗したモデルは、必要なときに再試行できます。
          - 再試行の支払い元は、この欄に表示されます。
        next:
          title: 次の手順
          points:
          - 候補が2つそろったら、ブラインドレビューを始めます。
      blind_review:
        intro:
          title: ブラインドレビュー
          points:
          - レビュー担当モデルが、各候補を確認します。
          - どのモデルの訳かは、レビュー担当モデルには伏せられます。
        progress:
          title: 進み具合
          points:
          - ブラインドレビューは、翻訳の次の工程です。
        evaluations:
          title: レビュー
          points:
          - 候補ごとに、各レビュー担当モデルの意見を読めます。
          - 訳し方の提案が含まれることもあります。
        retry:
          title: 失敗したレビューの再試行
          points:
          - 失敗したレビューは、必要なときに再試行できます。
          - 再試行の支払い元は、この欄に表示されます。
        next:
          title: 判定に進む
          points:
          - レビューが終わったら、判定担当モデルを選んで候補に順位をつけます。
      judging:
        intro:
          title: 判定
          points:
          - 判定担当モデルが、レビュー済みの候補に点数と順位をつけます。
          - 各モデルは、それぞれ独立して判定します。
        progress:
          title: 進み具合
          points:
          - 判定は、ブラインドレビューの次の工程です。
          - そのあとがエディターです。
        winner:
          title: 採用された訳
          points:
          - 最も順位の高い候補です。
          - ここからエディターで開けます。
        runs:
          title: 判定結果
          points:
          - 各モデルが選んだ訳、確信度、理由を確認できます。
        retry:
          title: 失敗した判定の再試行
          points:
          - 失敗した判定は、必要なときに再試行できます。
          - 再試行の支払い元は、この欄に表示されます。
      final_editor:
        intro:
          title: 最終訳エディター
          points:
          - ここで最終的な判断を行います。
          - ご自身で編集しない限り、下書きは変わりません。
        guidance:
          title: 使った指示
          points:
          - この翻訳で使った用語集、翻訳方針、参考訳です。
        draft:
          title: 下書き
          points:
          - 編集して、版を保存します。
          - 今の版を、TXTまたはDOCXでダウンロードできます。
        refine:
          title: AIの修正案
          points:
          - AIモデルに、この版をよくする案を出してもらえます。
          - 修正案は、使いたいときだけ適用します。
        revisions:
          title: 版の履歴
          points:
          - 保存した版は、すべて残ります。
          - 以前の版を、新しい版として復元できます。
        finalize:
          title: 確定
          points:
          - 訳文が仕上がったら確定します。
          - 確定後も、もう一度開けます。
      benchmarks:
        intro:
          title: モデル評価
          points:
          - これまでの翻訳で、各モデルがどうだったかを確認できます。
          - 平均値には、もとになった結果の件数も表示されます。
        sort:
          title: 並べ替え
          points:
          - 重視したい指標で、モデルを並べ替えます。
        list:
          title: モデル別の結果
          points:
          - モデルを開くと、詳しい内容と最近の作業を確認できます。
        roles:
          title: レビュー・判定での結果
          points:
          - レビュー担当や判定担当として、どう働いたかを確認できます。
          - 差は起きたことを示すもので、原因までは示しません。
  file_field:
    choose: ファイルを選択
    replace: 別のファイルを選択
    remove: 削除
    remove_named: "%{name}を削除"
    drop: またはここにファイルをドロップ
    none: ファイルが選択されていません。
    help: TXT、Markdown、DOCX、PDF · %{maximum} MiBまで · 保存時にもう一度検査します
    selected: "%{name}を選択しました（%{size}）。"
    removed: ファイルを削除しました。
    unsupported: "%{name}は対応していないファイルです。TXT、Markdown、DOCX、PDFのいずれかを選んでください。"
    too_large: "%{name}はアップロード上限を超えています。"
    multiple: ファイルは1つだけ選択してください。
    both: 上にテキストも貼り付けられています。保存前にテキストかファイルのどちらかを削除してください。使えるのは一方だけです。
