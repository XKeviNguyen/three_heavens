ja:
  product_tour:
    ui:
      help: ヘルプ
      full_tour: 製品ツアー（全体）
      page_tour: このページのツアー
      next: 次へ
      back: 戻る
      skip: ツアーをスキップ
      finish: 完了
      close: ツアーを閉じる
      step_counter: "%{current} / %{total}"
      start_translation: 新しい翻訳を始める
      refreshing: "AI処理の実行中、このページは自動的に更新されます。ツアーは処理の完了後にご利用いただけます。"
      invite:
        title: Three Heavensは初めてですか？
        body: 翻訳、レビュー、ナレッジライブラリがどう連携するかを、7ステップのツアーで紹介します。設定は何も変更されず、ヘルプからいつでもやり直せます。
        start: ツアーを始める
        later: 今はしない
    global:
      welcome:
        title: Three Heavensへようこそ
        body: AIが支援する翻訳ワークスペースです。複数のモデルが翻訳し、別のモデルが結果を独立してレビュー・判定します。最終的な編集の判断は、お持ちの用語や例をもとにあなたが行います。
      workspace:
        title: ワークスペース
        body: 新しい作業は「新しい翻訳」から始めます。プロジェクトは言語ペアごとの文書と実行結果をまとめ、「履歴」はすべての翻訳を新しい順に表示するので、どれでも開き直せます。
      knowledge:
        title: 翻訳ナレッジ
        body: 用語集には優先する用語、参考訳には承認済みの訳文、翻訳方針には再利用できる指示を保存します。翻訳を始めるときに選ぶと、用語や文体をそろえられます。
      workflows:
        title: ワークフロー設定
        body: 翻訳、レビュー、判定、修正案の作成を担当するモデルを保存できます。自動モードで保存済みの設定を選ぶと、翻訳、ブラインドレビュー、判定を順に実行し、編集できる状態で停止します。
      ai_access:
        title: AIの利用と支払い
        body: AI設定で、新しいAI処理の支払い元を選びます。自分のOpenRouterキーを使うと、あなたのOpenRouterアカウントに請求されます。プラットフォーム管理のAIはプラットフォームが支払い、管理者の承認が必要です。キーを追加しなくても、このツアーは最後まで進められます。
      start:
        title: 翻訳を始める
        body: 原文と訳文の言語を選び、テキストを貼り付けるか、TXT、Markdown、DOCX、PDFファイルをアップロードします。必要に応じて指示を追加し、モデルまたはワークフロー設定を選びます。ご自身で開始するまで、AIには何も送信されません。
      quality:
        title: 翻訳候補から最終訳まで
        body: 各モデルの翻訳が候補になります。レビューモデルはどのモデルの訳かを知らずに候補を評価し、判定モデルが順位を付けます。採用された訳はエディターで開き、修正、版の比較、確定、TXTまたはDOCXでのダウンロードができます。
    pages:
      new_translation:
        intro:
          title: 新しい翻訳
          body: このページでは、1回の翻訳に必要な内容をまとめて設定します。開始を選ぶまで、処理は始まらず、料金も発生しません。
        languages:
          title: プロジェクトと言語
          body: 既存のプロジェクトを選ぶか、新しいプロジェクト名と原文・訳文の言語を入力します。1つのプロジェクトには1つの言語ペアが対応します。
        source:
          title: 原文
          body: テキストを貼り付けるか、「アップロード」に切り替えてTXT、Markdown、DOCX、PDFファイルを選びます。開始前に、抽出されたテキストを確認して編集できます。
        knowledge:
          title: 任意の指示
          body: 優先する用語を使うには用語集を選びます。詳細オプションでは、承認済みの参考訳、翻訳方針、優先する指示を設定できます。
        workflow:
          title: AIワークフロー
          body: 手動モードでは翻訳モデルを自分で選びます。自動モードでは、保存済みのワークフロー設定でレビューと判定まで実行します。どちらでも、最終訳はあなたが承認します。
        launch:
          title: 確認して開始
          body: この実行の支払い元と処理内容を確認してから開始します。このページでAIに処理を送るのは、開始ボタンだけです。
      source_import:
        intro:
          title: 原文ファイルをアップロード
          body: 文書を1つアップロードして、確認できる原文テキストに変換します。アップロードとプレビューでAIに送信されることはありません。
        file:
          title: ファイルを選択またはドロップ
          body: TXT、Markdown、DOCX、PDFファイルを、表示されているサイズ上限内で利用できます。抽出されたテキストは、翻訳前に確認できるよう表示されます。
      projects:
        intro:
          title: プロジェクト
          body: プロジェクトは、1つの言語ペアの文書と、そこから実行したすべての翻訳をまとめます。
        list:
          title: プロジェクト一覧
          body: プロジェクトを開くと、文書と各翻訳の進行状況を確認できます。
        start:
          title: このプロジェクトに作業を追加
          body: 新しい原文を貼り付けるか、ファイルをアップロードします。プロジェクトの言語は自動で入力されます。
        documents:
          title: 文書
          body: 各文書の下に、その翻訳が新しい順に並びます。アップロードした元ファイルは、もう一度ダウンロードできます。
        next_action:
          title: 続きから再開
          body: 強調表示されたリンクは、その翻訳の次に行うとよい手順（ブラインドレビュー、判定、エディターなど）を示します。
      history:
        intro:
          title: 翻訳履歴
          body: これまでのすべての翻訳を、新しい順に表示します。状況、モデル、判明しているAI費用も確認できます。
        list:
          title: 翻訳を探す
          body: 各項目に、プロジェクト、言語、使用した指示が表示されます。
        reopen:
          title: 開き直す・繰り返す
          body: 次の手順に進む、任意の段階を開く、またはその設定を新しい翻訳として再利用できます。
      terminology:
        intro:
          title: 用語集
          body: 用語集は、1つの言語ペアで優先する用語をまとめたものです。すべての翻訳で同じ表現を使えます。
        create:
          title: 用語集を作成
          body: 言語ペアを指定して、新しい用語集を作成します。
        list:
          title: 用語集一覧
          body: 有効な用語集は、翻訳を始めるときに選べます。
        entries:
          title: 用語
          body: 原文の用語と、優先する訳語を1つずつ追加します。保存すると新しい版が作成されます。
        revisions:
          title: 版
          body: 保存した変更は、それぞれ1つの版になります。用語集を編集しても、各翻訳は使用した版のまま保持されます。
        status:
          title: 修正またはアーカイブ
          body: 新しい版を作成するか、新しい作業では使わない用語集をアーカイブします。アーカイブしても履歴は残ります。
      references:
        intro:
          title: 参考訳
          body: 参考訳は、原文の一節と、承認済みの訳文を組にしたものです。AIが、確立された表現や文体に沿って翻訳できます。
        create:
          title: 参考訳を追加
          body: 言語ペアを指定して、参考訳を作成します。
        list:
          title: 参考訳一覧
          body: 有効な参考訳は、新しい翻訳の詳細オプションで選べます。
        source:
          title: 原文の例
          body: 原文の一節を貼り付けるか、ファイルを1つアップロードします。貼り付けたテキストとファイルは、どちらか一方だけ指定してください。
        translation:
          title: 承認済みの訳文
          body: その一節について承認した訳文を、貼り付けるかアップロードします。ファイルは保存時に検査され、テキストが抽出されます。
        revisions:
          title: 版の履歴
          body: 保存するたびに新しい版ができます。各翻訳は、使用した版のまま保持されます。
      methodology:
        intro:
          title: 翻訳方針
          body: 翻訳方針は、トーン、読み手、書式のルールなど、翻訳の進め方を文章でまとめた再利用できる指示です。
        create:
          title: 翻訳方針を作成
          body: 指示を一度書けば、複数の翻訳で再利用できます。
        list:
          title: 翻訳方針一覧
          body: 有効な翻訳方針は、新しい翻訳の詳細オプションで選べます。
        instructions:
          title: 指示
          body: 訳文をどのような読み味にしたいかを記述します。保存すると新しい版が作成されます。
        revisions:
          title: 版
          body: 各翻訳は使用した版のまま保持されるため、過去の結果の根拠を後から確認できます。
      workflows:
        intro:
          title: ワークフロー設定
          body: ワークフロー設定には、翻訳、レビュー、判定、修正案の作成を担当するモデルを保存します。自動モードで使います。
        create:
          title: 設定を作成
          body: 新しい設定を作成するか、既存の設定を複製して調整します。
        list:
          title: 設定一覧
          body: 有効な設定は、「新しい翻訳」ページの自動モードに表示されます。
        configure:
          title: モデルを選ぶ
          body: 役割ごとにモデルを選びます。自動実行ではこのモデルだけを使い、開始前に予定されるAI処理を表示します。
        completion:
          title: 停止するタイミング
          body: 採用された下書きで停止するか、AIの修正案も集めるかを選べます。修正案は、適用しない限り下書きを変更しません。
        pipeline:
          title: 進行状況
          body: 自動実行は、翻訳、ブラインドレビュー、判定の順に進み、編集できる状態になったら停止します。
      ai_settings:
        intro:
          title: AI設定
          body: 新しいAI処理の支払い元を選びます。このページの操作でAI処理が始まることはありません。
        status:
          title: 現在の状態
          body: 新しいAI処理を開始できるかどうかと、その支払い元を表示します。
        source:
          title: 支払い元
          body: 自分のOpenRouterキーを使うと、あなたのOpenRouterアカウントに請求されます。プラットフォーム管理のAIはプラットフォームが支払い、管理者の承認が必要です。
        key:
          title: OpenRouterキー
          body: キーは暗号化して保存され、再表示されません。表示されるのは末尾の数文字だけです。キーを置き換えたり削除したりしても、作業がプラットフォームのキーに切り替わることはありません。
        billing:
          title: 課金の仕組み
          body: 各実行は、開始時の支払い元を記録します。この設定の変更は新しい作業にのみ反映されます。明示的な再試行では、横に表示された支払い元が使われます。
      results:
        intro:
          title: 翻訳結果
          body: このページでは、1回の翻訳を各モデルの処理から次の手順まで追えます。
        progress:
          title: 現在の進行状況
          body: 翻訳、ブラインドレビュー、判定、エディターの順に表示し、現在の段階を強調します。
        outputs:
          title: 翻訳候補
          body: 各モデルの出力、状態、判明している費用を表示します。
        retry:
          title: 失敗した処理を再試行
          body: 失敗したモデルは、明示的に再試行できます。パネルに、その再試行の支払い元が表示されます。
        next:
          title: 次の手順
          body: 完了した候補が2件以上ある場合は、ブラインドレビューを開始するか、既存のレビューに進みます。
      blind_review:
        intro:
          title: ブラインドレビュー
          body: レビューモデルは、どのモデルが書いた訳かを知らずに候補を評価します。
        progress:
          title: ワークフローの進行状況
          body: ブラインドレビューは、翻訳に続く2番目の段階です。
        evaluations:
          title: レビュー
          body: 各レビューモデルが候補ごとに出した構造化フィードバックです。提案された表現がある場合はそれも含まれます。
        retry:
          title: 失敗したレビューを再試行
          body: 失敗したレビューモデルは、明示的に再試行できます。パネルに、その再試行の支払い元が表示されます。
        next:
          title: 判定に進む
          body: レビューが完了したら、候補の順位を付ける判定モデルを選びます。
      judging:
        intro:
          title: 判定
          body: 判定モデルが、レビュー済みの候補を独立して採点し、順位を付けます。
        progress:
          title: ワークフローの進行状況
          body: 判定は3番目の段階で、その次がエディターです。
        winner:
          title: 採用された訳
          body: 総合で採用された訳と、最終訳エディターで開く方法を表示します。
        runs:
          title: 判定結果
          body: 各判定モデルが選んだ訳、確信度、理由、強み、リスクを確認でき、結果に至った過程がわかります。
        retry:
          title: 失敗した判定を再試行
          body: 失敗した判定モデルは、明示的に再試行できます。パネルに、その再試行の支払い元が表示されます。
      final_editor:
        intro:
          title: 最終訳エディター
          body: ここで最終的な判断を行います。あなたが操作しない限り、下書きは変更されません。
        guidance:
          title: 使用した指示
          body: この翻訳で使った用語集、翻訳方針、参考訳です。編集しながら確認できます。
        draft:
          title: 下書き
          body: 編集して版を保存します。現在の版は、いつでもTXTまたはDOCXでダウンロードできます。
        refine:
          title: AIの修正案
          body: 修正案モデルに、現在の版の改善案を依頼します。修正案は、必要な場合にだけ適用してください。
        revisions:
          title: 版の履歴
          body: 保存したすべての版が残ります。以前の版は、新しい下書きの版として復元できます。
        finalize:
          title: 確定
          body: 準備ができたら現在の版を確定します。必要であれば、後から再編集できます。
      benchmarks:
        intro:
          title: モデル評価
          body: あなた自身の翻訳での、各モデルの成績です。平均値には、何件の結果に基づくかが表示されます。
        sort:
          title: モデルを並べ替え
          body: 重視する指標でモデルを並べ替えます。
        list:
          title: モデルの結果
          body: モデルを開くと、役割別の診断と最近の履歴を確認できます。
        roles:
          title: 役割別の診断
          body: レビューモデルや判定モデルとしての動きを示します。差は実際に起きたことを表すもので、原因を証明するものではありません。
  file_field:
    choose: ファイルを選択
    replace: 別のファイルを選択
    remove: 削除
    remove_named: "%{name}を削除"
    drop: またはここにファイルをドロップ
    none: ファイルが選択されていません。
    help: "TXT、Markdown、DOCX、PDF · %{maximum} MiBまで · 保存時にもう一度検査します"
    selected: "%{name}を選択しました（%{size}）。"
    removed: ファイルを削除しました。
    unsupported: "%{name}は対応していないファイルです。TXT、Markdown、DOCX、PDFのいずれかを選んでください。"
    too_large: "%{name}はアップロード上限を超えています。"
    multiple: ファイルは1つだけ選択してください。
    both: 上にテキストも貼り付けられています。保存前にテキストかファイルのどちらかを削除してください。使えるのは一方だけです。
