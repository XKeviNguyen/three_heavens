<%
  web_host = ENV.fetch("KAMAL_WEB_HOST")
  app_host = ENV.fetch("APP_HOST")
  image_name = ENV.fetch("KAMAL_IMAGE")
  registry_server = ENV.fetch("KAMAL_REGISTRY_SERVER")
  registry_username = ENV.fetch("KAMAL_REGISTRY_USERNAME")
%>

service: three_heavens
image: <%= image_name %>

servers:
  web:
    - <%= web_host %>

proxy:
  ssl: true
  host: <%= app_host %>
  buffering:
    max_request_body: 12_582_912
  healthcheck:
    path: /up

registry:
  server: <%= registry_server %>
  username: <%= registry_username %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - OPENROUTER_API_KEY
  clear:
    APP_HOST: <%= app_host %>
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info
    AI_STALE_EXECUTION_THRESHOLD_MINUTES: 120

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "three_heavens_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
