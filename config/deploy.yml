<%
  web_host = ENV.fetch("KAMAL_WEB_HOST")
  app_host = ENV.fetch("APP_HOST")
  image_name = ENV.fetch("KAMAL_IMAGE")
  registry_server = ENV.fetch("KAMAL_REGISTRY_SERVER")
  registry_username = ENV.fetch("KAMAL_REGISTRY_USERNAME")
  # Production refuses to boot without mail delivery configuration. The SMTP
  # username and password are secrets; these are not.
  mail_from = ENV.fetch("MAIL_FROM")
  smtp_host = ENV.fetch("SMTP_HOST")
  smtp_port = ENV.fetch("SMTP_PORT", "587")
  # The production Google OAuth Web client ID: a public identifier, not a
  # secret. Sign in with Google uses no client secret.
  google_client_id = ENV.fetch("GOOGLE_CLIENT_ID")
%>

service: three_heavens
image: <%= image_name %>

servers:
  web:
    hosts:
      - <%= web_host %>
    # Each connection's kernel socket buffers count against the container's
    # memory and otherwise grow to several MiB, so many simultaneous request
    # bodies could exhaust a small container. These limits are per network
    # namespace: they apply to this container only (Kamal runs it on its own
    # network) and leave ample throughput for its upstream calls.
    options:
      sysctl:
        - net.ipv4.tcp_rmem=4096 65536 262144
        - net.ipv4.tcp_wmem=4096 65536 262144

# Browsers reach kamal-proxy only through a Cloudflare Tunnel: Cloudflare
# terminates TLS and cloudflared, on the kamal Docker network, connects to
# kamal-proxy's port 80. kamal-proxy therefore publishes no host port, and
# forwards Cloudflare's X-Forwarded-For so each visitor keeps their own
# rate-limit budget. Forwarding is safe only while nothing else can reach
# kamal-proxy; never publish its ports with these settings. `run` applies
# when the proxy container is created, not on every deploy
# (docs/operations/production-deploy.md, step 11).
proxy:
  ssl: false
  forward_headers: true
  host: <%= app_host %>
  buffering:
    max_request_body: 45_088_768
  healthcheck:
    path: /up
  run:
    publish: false

registry:
  server: <%= registry_server %>
  username: <%= registry_username %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - OPENROUTER_API_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    APP_HOST: <%= app_host %>
    MAIL_FROM: <%= mail_from.to_json %>
    SMTP_HOST: <%= smtp_host.to_json %>
    SMTP_PORT: <%= smtp_port.to_json %>
    GOOGLE_CLIENT_ID: <%= google_client_id.to_json %>
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info
    AI_STALE_EXECUTION_THRESHOLD_MINUTES: 120

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "three_heavens_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
