<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="architecture-overview-title architecture-overview-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="architecture-overview-title">Three Heavens architecture and the failure boundaries studied in the case studies</title>
  <desc id="architecture-overview-desc">Top to bottom: the browser (draft autosave, source upload, Start translation, Back/Forward and the Turbo cache, the session cookie, and the CI browser tests that drive this UI); an unreliable HTTPS network where a response can be lost, duplicated, delayed or reordered; the memory-capped production container with kamal-proxy, Thruster, Puma and Rails, application services and Solid Queue jobs that call the external OpenRouter service (dashed border); the authoritative state in PostgreSQL and in the Active Storage volume, which share no transaction; and the backup and isolated restore drill. Blue tags give the numbers of the case studies (01 to 15) that investigated each boundary.</desc>
  <style>
    .bg{fill:#ffffff}
    .panel{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    .box{fill:#ffffff;stroke:#57606a;stroke-width:1.5}
    .ext{fill:#ffffff;stroke:#57606a;stroke-width:1.5;stroke-dasharray:5 4}
    .net{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5;stroke-dasharray:7 5}
    .gapl{stroke:#cf222e;stroke-width:2.5;stroke-dasharray:6 5;fill:none}
    .gapt{fill:#cf222e;font-size:14px;font-weight:600}
    .h{fill:#1f2328;font-size:19px;font-weight:700}
    .t{fill:#1f2328;font-size:16px}
    .s{fill:#57606a;font-size:14.5px}
    .tag{fill:#0969da}
    .tagt{fill:#ffffff;font-size:13px;font-weight:700}
    .arrow{stroke:#57606a;stroke-width:2;fill:none}
    .ah{fill:#57606a}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .panel{fill:#161b22;stroke:#8b949e}
      .box{fill:#0d1117;stroke:#8b949e}
      .ext{fill:#0d1117;stroke:#8b949e}
      .net{fill:#2b2111;stroke:#d29922}
      .gapl{stroke:#f85149}
      .gapt{fill:#ff7b72}
      .h,.t{fill:#e6edf3}
      .s{fill:#9198a1}
      .tag{fill:#1f6feb}
      .arrow{stroke:#8b949e}
      .ah{fill:#8b949e}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="560" height="960" rx="12"/>

  <!-- Browser -->
  <rect class="panel" x="16" y="16" width="528" height="210" rx="10"/>
  <text class="h" x="32" y="46">Browser · Turbo · Stimulus</text>
  <text class="s" x="32" y="68">Every page load is its own editor; tabs run concurrently</text>
  <rect class="box" x="32" y="82" width="244" height="40" rx="6"/><text class="t" x="44" y="108">Draft autosave</text>
  <rect class="tag" x="198" y="90" width="72" height="24" rx="12"/><text class="tagt" x="234" y="107" text-anchor="middle">02 10 11</text>
  <rect class="box" x="284" y="82" width="244" height="40" rx="6"/><text class="t" x="296" y="108">Source upload</text>
  <rect class="tag" x="474" y="90" width="48" height="24" rx="12"/><text class="tagt" x="498" y="107" text-anchor="middle">07 12</text>
  <rect class="box" x="32" y="130" width="244" height="40" rx="6"/><text class="t" x="44" y="156">Start translation</text>
  <rect class="tag" x="238" y="138" width="32" height="24" rx="12"/><text class="tagt" x="254" y="155" text-anchor="middle">08</text>
  <rect class="box" x="284" y="130" width="244" height="40" rx="6"/><text class="t" x="296" y="156">Back / Forward</text>
  <rect class="tag" x="490" y="138" width="32" height="24" rx="12"/><text class="tagt" x="506" y="155" text-anchor="middle">09</text>
  <rect class="box" x="32" y="178" width="244" height="40" rx="6"/><text class="t" x="44" y="204">Session cookie</text>
  <rect class="tag" x="222" y="186" width="48" height="24" rx="12"/><text class="tagt" x="246" y="203" text-anchor="middle">06 13</text>
  <rect class="box" x="284" y="178" width="244" height="40" rx="6"/><text class="t" x="296" y="204">CI browser tests</text>
  <rect class="tag" x="490" y="186" width="32" height="24" rx="12"/><text class="tagt" x="506" y="203" text-anchor="middle">05</text>

  <!-- Network -->
  <path class="arrow" d="M280 228 V252" marker-end="url(#a)"/>
  <rect class="net" x="16" y="256" width="528" height="84" rx="10"/>
  <text class="h" x="32" y="286">HTTPS network</text>
  <rect class="tag" x="412" y="270" width="116" height="24" rx="12"/><text class="tagt" x="470" y="287" text-anchor="middle">02 07 08 10 12</text>
  <text class="t" x="32" y="314">A response can be lost, duplicated,</text>
  <text class="t" x="32" y="333">delayed or reordered</text>
  <path class="arrow" d="M280 342 V366" marker-end="url(#a)"/>

  <!-- Container -->
  <rect class="panel" x="16" y="370" width="528" height="356" rx="10"/>
  <text class="h" x="32" y="400">Production container</text>
  <text class="s" x="32" y="422">memory limit · kernel TCP buffers</text>
  <rect class="tag" x="490" y="384" width="32" height="24" rx="12"/><text class="tagt" x="506" y="401" text-anchor="middle">03</text>

  <rect class="box" x="32" y="436" width="152" height="58" rx="6"/>
  <text class="t" x="42" y="460">kamal-proxy</text><text class="s" x="42" y="482">TLS · body cap</text>
  <path class="arrow" d="M186 465 H200" marker-end="url(#a)"/>
  <rect class="box" x="204" y="436" width="112" height="58" rx="6"/>
  <text class="t" x="214" y="460">Thruster</text><text class="s" x="214" y="482">HTTP front</text>
  <path class="arrow" d="M318 465 H332" marker-end="url(#a)"/>
  <rect class="box" x="336" y="436" width="192" height="58" rx="6"/>
  <text class="t" x="346" y="460">Puma · Rails 8.1</text><text class="s" x="346" y="482">Bundler boot</text>
  <rect class="tag" x="490" y="466" width="32" height="24" rx="12"/><text class="tagt" x="506" y="483" text-anchor="middle">04</text>

  <rect class="box" x="32" y="508" width="496" height="120" rx="6"/>
  <text class="t" x="44" y="532">Controllers → services → models</text>
  <rect class="tag" x="434" y="516" width="88" height="24" rx="12"/><text class="tagt" x="478" y="533" text-anchor="middle">06 08 10 12</text>
  <text class="s" x="44" y="558">Sessions · draft Save / Discard</text>
  <text class="s" x="44" y="580">TranslationWorkspace#submit</text>
  <text class="s" x="44" y="602">SourceImports::Create · upload budget</text>

  <rect class="box" x="32" y="642" width="300" height="64" rx="6"/>
  <text class="t" x="44" y="668">Solid Queue jobs</text><rect class="tag" x="278" y="650" width="48" height="24" rx="12"/><text class="tagt" x="302" y="667" text-anchor="middle">14 15</text><text class="s" x="44" y="690">enqueued after commit</text>
  <path class="arrow" d="M334 674 H372" marker-end="url(#a)"/>
  <rect class="ext" x="376" y="642" width="152" height="64" rx="6"/>
  <text class="t" x="388" y="668">OpenRouter</text><text class="s" x="388" y="690">external, paid</text>

  <!-- Authoritative state -->
  <path class="arrow" d="M140 728 V752" marker-end="url(#a)"/>
  <path class="arrow" d="M420 728 V752" marker-end="url(#a)"/>
  <rect class="box" x="16" y="756" width="250" height="100" rx="10"/>
  <text class="h" x="30" y="786">PostgreSQL</text>
  <rect class="tag" x="166" y="768" width="88" height="24" rx="12"/><text class="tagt" x="210" y="785" text-anchor="middle">08 10 11 13</text>
  <text class="s" x="30" y="812">row + advisory locks</text>
  <text class="s" x="30" y="834">unique indexes · CHECKs</text>
  <path class="gapl" d="M280 760 V852"/>
  <rect class="box" x="294" y="756" width="250" height="100" rx="10"/>
  <text class="h" x="308" y="786">Active Storage</text>
  <rect class="tag" x="500" y="768" width="32" height="24" rx="12"/><text class="tagt" x="516" y="785" text-anchor="middle">12</text>
  <text class="s" x="308" y="812">uploaded file bytes</text>
  <text class="s" x="308" y="834">on a private volume</text>
  <text class="gapt" x="280" y="876" text-anchor="middle">no transaction spans both stores</text>

  <!-- Backup -->
  <rect class="panel" x="16" y="888" width="528" height="58" rx="10"/>
  <text class="t" x="32" y="922" font-weight="700">Backup → isolated restore drill</text>
  <rect class="tag" x="490" y="905" width="32" height="24" rx="12"/><text class="tagt" x="506" y="922" text-anchor="middle">01</text>
</svg>
