<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 466" width="560" height="466" role="img" aria-labelledby="turbo-race-reproduction-title turbo-race-reproduction-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="turbo-race-reproduction-title">Case 05: failure rate of three system-test races before and after PR #70</title>
  <desc id="turbo-race-reproduction-desc">Horizontal bars of failed runs per repeated run of the same test, as recorded in PR #70 (local same-process reproduction under CPU contention, Ruby 3.4.10, PostgreSQL 17.11, Chromium 141). Sidebar race, the CI failure: before the fix 6 of 20, 6 of 20, and 3 of 20 on commit e48cfa2; after the fix 0 of 40. Discard reset race: before 6 of 60, after 0 of 40. Dark-appearance save race with 4 workers: before 2 of 40, after 0 of 100.</desc>
  <style>
    .bg{fill:#ffffff} .before{fill:#eb6834} .after{fill:#2a78d6}
    .h{fill:#1f2328;font-size:18px;font-weight:700} .s,.m,.t{fill:#57606a;font-size:13.5px}
    .g{fill:#1f2328;font-size:15px;font-weight:600} .l{fill:#1f2328;font-size:14px} .v{fill:#1f2328;font-size:14px;font-weight:600}
    .grid{stroke:#d0d7de;stroke-width:1}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .before{fill:#d95926} .after{fill:#3987e5}
      .h,.g,.l,.v{fill:#e6edf3} .s,.m,.t{fill:#9198a1} .grid{stroke:#30363d}
    }
  </style>
  <rect class="bg" width="560" height="466" rx="12"/>
  <text class="h" x="16" y="30">Repeated runs that failed, per race</text>
  <text class="s" x="16" y="52">Failed runs / total runs · local repro under CPU contention (PR #70)</text>
  <rect class="before" x="16" y="66" width="14" height="14" rx="3"/><text class="l" x="36" y="78">Before the fix</text>
  <text class="l" x="160" y="78">After the fix: 0 failures (no bar)</text>
  <text class="t" x="196.0" y="106" text-anchor="middle">0%</text><text class="t" x="272.0" y="106" text-anchor="middle">10%</text><text class="t" x="348.0" y="106" text-anchor="middle">20%</text><text class="t" x="424.0" y="106" text-anchor="middle">30%</text><text class="t" x="500.0" y="106" text-anchor="middle">40%</text>
