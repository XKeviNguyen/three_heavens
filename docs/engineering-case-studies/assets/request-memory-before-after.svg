<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 552" width="560" height="552" role="img" aria-labelledby="request-memory-before-after-title request-memory-before-after-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="request-memory-before-after-title">Case 03: container memory before and after bounding request-body memory</title>
  <desc id="request-memory-before-after-desc">Values recorded in PR #68, production image with a 768 MiB no-swap limit on a bridge network. Before the fix, with socket limits removed and 80 simultaneous 30 MiB chunked bodies sent in 64 KiB chunks, the container was OOM-killed; at the kill it held 404 MiB of process memory, 268 MiB of kernel socket buffers and 120 MiB of dirty temp-file pages, which together exceed the 768 MiB limit. After the fix, in ten waves of 80 bodies sent in 1 KiB chunks with both controls on, Puma process memory measured after each wave stayed between 168 and 238 MiB and nothing was OOM-killed. The two runs used different chunk sizes and the after-fix figure is process memory only, so they are not a like-for-like comparison.</desc>
  <style>
    .bg{fill:#ffffff} .p{fill:#2a78d6} .k{fill:#eb6834} .f{fill:#1baf7a}
    .h{fill:#1f2328;font-size:18px;font-weight:700} .g{fill:#1f2328;font-size:15px;font-weight:600}
    .s,.t{fill:#57606a;font-size:13.5px} .l,.v{fill:#1f2328;font-size:14px} .v{font-weight:600}
    .lt{fill:#1f2328;font-size:13px;font-weight:600} .lim{stroke:#1f2328;stroke-width:2;stroke-dasharray:5 4}
    .grid{stroke:#d0d7de;stroke-width:1} .bad{fill:#cf222e} .good{fill:#1a7f37}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .p{fill:#3987e5} .k{fill:#d95926} .f{fill:#199e70}
      .h,.g,.l,.v,.lt{fill:#e6edf3} .s,.t{fill:#9198a1} .lim{stroke:#e6edf3} .grid{stroke:#30363d}
      .bad{fill:#ff7b72} .good{fill:#3fb950}
    }
  </style>
  <rect class="bg" width="560" height="552" rx="12"/>
  <text class="h" x="16" y="30">Container memory under a request-body flood</text>
  <text class="s" x="16" y="52">30 MiB chunked bodies, all sent at once (values from PR #68)</text>
  <text class="g" x="16" y="92">Before · 80 bodies, 64 KiB chunks · <tspan class="bad">OOM-killed</tspan></text><text class="s" x="16" y="112">Socket limits removed (SYSCTLS=none). Breakdown at the kill.</text><line class="grid" x1="24.0" y1="138" x2="24.0" y2="198"/><text class="t" x="24.0" y="216" text-anchor="start">0</text><line class="grid" x1="152.0" y1="138" x2="152.0" y2="198"/><text class="t" x="152.0" y="216" text-anchor="middle">200</text><line class="grid" x1="280.0" y1="138" x2="280.0" y2="198"/><text class="t" x="280.0" y="216" text-anchor="middle">400</text><line class="grid" x1="408.0" y1="138" x2="408.0" y2="198"/><text class="t" x="408.0" y="216" text-anchor="middle">600</text><line class="grid" x1="536.0" y1="138" x2="536.0" y2="198"/><text class="t" x="536.0" y="216" text-anchor="end">800 MiB</text><rect class="p" x="24.0" y="156" width="256.6" height="34"/><text class="v" x="152.3" y="150" text-anchor="middle">404</text><rect class="k" x="282.6" y="156" width="169.5" height="34"/><text class="v" x="367.3" y="150" text-anchor="middle">268</text><path class="f" d="M454.1 156 h72.8 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-72.8 z"/><text class="v" x="492.5" y="150" text-anchor="middle">120</text><line class="lim" x1="515.5" y1="134" x2="515.5" y2="198"/><text class="lt" x="511.5" y="132" text-anchor="end">768 MiB limit</text><rect class="p" x="16" y="232" width="14" height="14" rx="3"/><text class="l" x="38" y="244">Process memory (Puma, jemalloc)</text><rect class="k" x="16" y="256" width="14" height="14" rx="3"/><text class="l" x="38" y="268">Kernel socket buffers</text><rect class="f" x="16" y="280" width="14" height="14" rx="3"/><text class="l" x="38" y="292">Dirty temp-file pages</text><text class="g" x="16" y="346">After · 10 waves of 80 bodies, 1 KiB chunks · <tspan class="good">no OOM</tspan></text><text class="s" x="16" y="366">Both controls on. Puma process memory after each wave.</text><line class="grid" x1="24.0" y1="388" x2="24.0" y2="436"/><text class="t" x="24.0" y="454" text-anchor="start">0</text><line class="grid" x1="152.0" y1="388" x2="152.0" y2="436"/><text class="t" x="152.0" y="454" text-anchor="middle">200</text><line class="grid" x1="280.0" y1="388" x2="280.0" y2="436"/><text class="t" x="280.0" y="454" text-anchor="middle">400</text><line class="grid" x1="408.0" y1="388" x2="408.0" y2="436"/><text class="t" x="408.0" y="454" text-anchor="middle">600</text><line class="grid" x1="536.0" y1="388" x2="536.0" y2="436"/><text class="t" x="536.0" y="454" text-anchor="end">800 MiB</text><rect class="p" x="131.5" y="406" width="44.8" height="22" rx="4"/><rect class="bg" x="180.3" y="404" width="262" height="26"/><text class="v" x="184.3" y="422">168–238 MiB (range over 10 waves)</text><line class="lim" x1="515.5" y1="384" x2="515.5" y2="436"/><text class="lt" x="511.5" y="382" text-anchor="end">768 MiB limit</text><text class="s" x="16" y="482">Not a like-for-like comparison: the two runs used different chunk</text><text class="s" x="16" y="502">sizes, and PR #68 reports only process memory after the fix.</text><text class="s" x="16" y="522">Production image, 768 MiB no-swap limit, bridge network.</text>
</svg>
