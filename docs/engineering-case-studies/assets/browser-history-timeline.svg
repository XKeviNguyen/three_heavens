<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 872" width="560" height="872" role="img" aria-labelledby="browser-history-timeline-title browser-history-timeline-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="browser-history-timeline-title">Case 09: Back then Forward while an autosave is unacknowledged, after PR #72</title>
  <desc id="browser-history-timeline-desc">Time runs downward across three lanes: browser history, the workspace guard in the page, and Rails with PostgreSQL. The user edits, and the test holds the autosave request in the browser before it is sent. history.back() fires popstate; the guard claims the traversal through the history:traverse event so Turbo never sees it, and the guard enters the saving phase. history.forward() is claimed the same way and replaces the destination; Turbo renders nothing. The held request is then released; the server commits the save and returns a response. If it is delivered, the guard moves to the allowed phase, makes the page inert and reloads, so a fresh document shows the current draft. If that response is lost after the commit, the save fails, history is restored and a leave dialog opens; the user chooses Stay, an online event retries the save, which the server acknowledges as a replay, and the status shows Saved. In both outcomes a later edit saves, a refresh shows it, and exactly one draft row exists. This is one tested interleaving from translation_workspace_draft_test.rb line 349, not every possible order.</desc>
  <style>
    .bg{fill:#ffffff} .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5} .state{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5} .bad{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
    .h{fill:#1f2328;font-size:18px;font-weight:700} .lh{fill:#1f2328;font-size:14px;font-weight:700}
    .bt{fill:#1f2328;font-size:14px;font-weight:600} .st{fill:#424a53;font-size:13.5px} .s{fill:#57606a;font-size:13.5px}
    .lane{stroke:#d0d7de;stroke-width:2;stroke-dasharray:2 6} .ar{stroke:#57606a;stroke-width:2;fill:none} .dash{stroke-dasharray:6 4} .ah{fill:#57606a}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .box{fill:#161b22;stroke:#8b949e} .state{fill:#0c2d6b;stroke:#4493f8}
      .ok{fill:#04260f;stroke:#3fb950} .bad{fill:#2b2111;stroke:#d29922}
      .h,.lh,.bt{fill:#e6edf3} .st{fill:#c9d1d9} .s{fill:#9198a1} .lane{stroke:#30363d} .ar{stroke:#8b949e} .ah{fill:#8b949e}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
