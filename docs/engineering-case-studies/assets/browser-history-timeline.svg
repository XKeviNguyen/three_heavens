  <text class="lh" x="94.0" y="104" text-anchor="middle">Browser history</text><line class="lane" x1="94.0" y1="114" x2="94.0" y2="498"/><text class="lh" x="276.0" y="104" text-anchor="middle">Workspace guard</text><line class="lane" x1="276.0" y1="114" x2="276.0" y2="498"/><text class="lh" x="462.0" y="104" text-anchor="middle">Rails + PostgreSQL</text><line class="lane" x1="462.0" y1="114" x2="462.0" y2="498"/>
  <rect class="box" x="184" y="128" width="184" height="71" rx="6"/><text class="bt" x="194" y="150">Edit the project name</text><text class="st" x="194" y="169">autosave POST held</text><text class="st" x="194" y="188">in the browser (test)</text><rect class="box" x="384" y="128" width="156" height="33" rx="6"/><text class="bt" x="394" y="150">Nothing sent yet</text><rect class="box" x="20" y="220" width="148" height="52" rx="6"/><text class="bt" x="30" y="242">history.back()</text><text class="st" x="30" y="261">popstate</text><rect class="state" x="184" y="220" width="184" height="71" rx="6"/><text class="bt" x="194" y="242">Traversal claimed via</text><text class="st" x="194" y="261">history:traverse; Turbo</text><text class="st" x="194" y="280">never sees it · saving</text><path class="ar" d="M168 250 L184 250" marker-end="url(#a)"/><rect class="box" x="20" y="324" width="148" height="52" rx="6"/><text class="bt" x="30" y="346">history.forward()</text><text class="st" x="30" y="365">popstate</text><rect class="state" x="184" y="324" width="184" height="71" rx="6"/><text class="bt" x="194" y="346">Claimed again; the</text><text class="st" x="194" y="365">latest destination wins</text><text class="st" x="194" y="384">Turbo renders: 0</text><path class="ar" d="M168 354 L184 354" marker-end="url(#a)"/><rect class="state" x="184" y="428" width="184" height="52" rx="6"/><text class="bt" x="194" y="450">Test releases</text><text class="st" x="194" y="469">the held POST</text><rect class="box" x="384" y="428" width="156" height="52" rx="6"/><text class="bt" x="394" y="450">Save commits;</text><text class="st" x="394" y="469">response returns</text><path class="ar" d="M368 458 L384 458" marker-end="url(#a)"/><text class="bt" x="16" y="518">Two tested outcomes for that response</text><rect class="ok" x="20" y="530" width="252" height="71" rx="6"/><text class="bt" x="30" y="552">Delivered (acknowledged)</text><text class="st" x="30" y="571">phase: allowed</text><text class="st" x="30" y="590">page made inert</text><rect class="bad" x="288" y="530" width="252" height="71" rx="6"/><text class="bt" x="298" y="552">Lost after commit</text><text class="st" x="298" y="571">flush fails, history</text><text class="st" x="298" y="590">restored, dialog opens</text><rect class="ok" x="20" y="646" width="252" height="52" rx="6"/><text class="bt" x="30" y="668">Reload → fresh document</text><text class="st" x="30" y="687">shows the current draft</text><rect class="bad" x="288" y="646" width="252" height="71" rx="6"/><text class="bt" x="298" y="668">User clicks Stay; 'online'</text><text class="st" x="298" y="687">→ retry acknowledged</text><text class="st" x="298" y="706">→ status: Saved</text><path class="ar" d="M146 601 L146 644" marker-end="url(#a)"/><path class="ar" d="M414 601 L414 644" marker-end="url(#a)"/><rect class="box" x="20" y="762" width="520" height="33" rx="6"/><text class="bt" x="30" y="784">Both: a later edit saves, refresh shows it, exactly 1 draft row</text><path class="ar" d="M146 698 L146 760" marker-end="url(#a)"/><path class="ar" d="M414 717 L414 760" marker-end="url(#a)"/><text class="st" x="16" y="820">Order of events in translation_workspace_draft_test.rb:349 (PR #72).</text><text class="st" x="16" y="840">One tested interleaving with two outcomes, not every possible order.</text>
